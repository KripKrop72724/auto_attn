name: Temporary Peshawar-02 OTA stack signed candidate

on:
  push:
    branches: [hotfix/zone-lite-ota-stack-device2-signing]

permissions:
  actions: read
  contents: read

jobs:
  signer-preflight:
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-signing
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: KripKrop72724/auto_attn
          run-id: 29844524799
          github-token: ${{ github.token }}
          name: zone-lite-esp32s3-13a23cf386e4264b6aa3250f0a0fda60962c530a
          path: unsigned
      - name: Normalize and sign the exact green main candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $PWD 'unsigned'
          $unsigned = Join-Path $PWD 'unsigned-package'
          New-Item -ItemType Directory -Path $unsigned -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $artifact 'bootloader\bootloader.bin') -Destination (Join-Path $unsigned 'bootloader.bin')
          Copy-Item -LiteralPath (Join-Path $artifact 'partition_table\partition-table.bin') -Destination (Join-Path $unsigned 'partition-table.bin')
          foreach ($name in @('ota_data_initial.bin', 'zone_lite.bin', 'flasher_args.json')) {
            Copy-Item -LiteralPath (Join-Path $artifact $name) -Destination (Join-Path $unsigned $name)
          }
          ./deploy/add/bootstrap-firmware-signing.ps1 `
            -VaultDirectory (Join-Path $env:ProgramData 'StateLife\AttendanceDeviceDashboard\firmware-signing') `
            -UnsignedDirectory $unsigned `
            -OutputDirectory (Join-Path $PWD 'signed-bootstrap') `
            -DeviceMac 'e0:72:a1:d7:05:c4'
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-signed-peshawar02-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: signed-bootstrap/
