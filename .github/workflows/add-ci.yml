name: ADD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: add-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-publication:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise publisher on production Windows PowerShell
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          ./tests/firmware/test_hil_publication.ps1
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.17
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.18
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.19
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.20
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.21
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.23
          ./tests/firmware/test_storage_recovery_publication.ps1
          ./tests/firmware/test_reader_matrix_policy.ps1
          ./tests/firmware/test_journal_hil_extension.ps1
          ./tests/firmware/test_bld9_k50_hil_extension.ps1
          ./tests/firmware/test_backup_restore.ps1
          ./tests/firmware/test_deployed_firmware_contract.ps1
          ./tests/firmware/test_usb_wifi_rescue_signing.ps1
      - name: Verify USB rescue signing refusals in PowerShell Core
        shell: pwsh
        run: ./tests/firmware/test_usb_wifi_rescue_signing.ps1
      - name: Verify repair USB identity and security guards
        shell: powershell
        run: ./tools/usb-wifi-rescue/test-guards.ps1
      - name: Verify repair guards in PowerShell Core
        shell: pwsh
        run: ./tools/usb-wifi-rescue/test-guards.ps1
      - name: Verify real repair child-process results in Windows PowerShell 5.1
        shell: powershell
        run: ./tools/usb-wifi-rescue/test-process.ps1
      - name: Verify real repair child-process results in PowerShell Core
        shell: pwsh
        run: ./tools/usb-wifi-rescue/test-process.ps1
      - name: Verify resume-only capture and power-cycle guards in Windows PowerShell 5.1
        shell: powershell
        run: ./tools/usb-wifi-rescue/test-capture.ps1
      - name: Verify resume-only capture and power-cycle guards in PowerShell Core
        shell: pwsh
        run: ./tools/usb-wifi-rescue/test-capture.ps1
      - name: Verify pinned audit source after Windows checkout
        shell: powershell
        run: |
          python -c "import hashlib,pathlib; from scripts.invoke_factory_audit import AUDITOR_SHA256; digest=hashlib.sha256(pathlib.Path('scripts/audit_factory_bundle.py').read_bytes()).hexdigest(); raise SystemExit(0 if digest == AUDITOR_SHA256 else 'AUDITOR_CHECKOUT_HASH_MISMATCH')"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned factory auditor checkout did not verify.' }

      - name: Get digest-pinned Zig compiler
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c') { throw 'Zig digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
      - name: Verify tools and build offline executable
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'security-tools.zip'
          python tools/usb-security-check/prepare_tools.py $tools
          if ($LASTEXITCODE -ne 0) { throw 'Tool verification failed' }
          $zig = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.14.1/zig.exe'
          python tools/usb-security-check/build.py $zig $tools
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          python tools/usb-wifi-rescue/build_ui_test.py $zig $tools
          if ($LASTEXITCODE -ne 0) { throw 'Disabled repair UI test build failed' }
      - name: Exercise disabled repair GUI with no device access
        shell: powershell
        run: |
          $process = Start-Process -FilePath (Join-Path $PWD 'dist/SLIC-WiFi-Repair-UI-TEST-ONLY.exe') -ArgumentList '--ui-smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Repair GUI smoke test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Repair GUI smoke test failed' }
      - name: Verify serial logging with absent, busy and streaming USB devices
        shell: powershell
        run: ./tools/usb-security-check/test-collector.ps1
      - name: Verify serial logging in PowerShell Core
        shell: pwsh
        run: ./tools/usb-security-check/test-collector.ps1
      - name: Exercise native GUI, PowerShell GUI and bundled offline esptool
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist/SLIC-USB-Security-Check-v1.3.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'GUI smoke test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed: $($process.ExitCode)" }
          New-Item -ItemType Directory smoke-logs -Force | Out-Null
          $desktop = [Environment]::GetFolderPath('Desktop')
          foreach ($folder in @($desktop, $env:TEMP)) {
            if ($folder -and (Test-Path $folder)) {
              Get-ChildItem -LiteralPath $folder -Filter 'SLIC-Startup-*.txt' | Copy-Item -Destination smoke-logs
            }
          }
          $content = (Get-ChildItem smoke-logs -File | Get-Content) -join "`n"
          if ($content -notmatch 'Confirmed: diagnostic GUI reported its Shown event' -or $content -notmatch '5\.1\.0') { throw 'GUI/offline tool evidence missing' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SLIC-USB-Security-Check-v1.3-windows
          retention-days: 7
          path: |
            dist/SLIC-USB-Security-Check-v1.3.exe
            smoke-logs/
            tools/usb-security-check/tool-metadata.json

  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce ADD and Zone Lite consolidation
        run: python3 scripts/check_repository_contract.py
      - name: Exercise immutable ordered HIL publication
        shell: pwsh
        run: |
          ./tests/firmware/test_hil_publication.ps1
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.17
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.18
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.19
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.20
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.21
          ./tests/firmware/test_hil_publication.ps1 -BridgeVersion 2.6.23
          ./tests/firmware/test_storage_recovery_publication.ps1
          ./tests/firmware/test_reader_matrix_policy.ps1
          ./tests/firmware/test_journal_hil_extension.ps1
          ./tests/firmware/test_bld9_k50_hil_extension.ps1
      - name: Exercise pre-migration backup restore gate
        shell: pwsh
        run: ./tests/firmware/test_backup_restore.ps1
      - name: Exercise deployed backend firmware admission
        shell: pwsh
        run: ./tests/firmware/test_deployed_firmware_contract.ps1
      - name: Parse production PowerShell scripts
        shell: pwsh
        run: |
          $productionScripts = @(
            'deploy/add/deploy.ps1',
            'deploy/add/collect-diagnostics.ps1',
            'deploy/add/Invoke-NationwideFirmwareRollout.ps1'
          )
          foreach ($path in $productionScripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object Message) -join [Environment]::NewLine
              throw "$path contains parser errors:$([Environment]::NewLine)$messages"
            }
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          if ($utf8NoBom.GetPreamble().Length -ne 0) {
            throw 'Deployment UTF-8 encoder unexpectedly emits a BOM.'
          }
          $deploySource = Get-Content -LiteralPath 'deploy/add/deploy.ps1' -Raw
          if ($deploySource -match '(?m)&\s+docker[^\r\n]*2>\$null') {
            throw 'Direct Docker stderr suppression is unsafe under Windows PowerShell 5.1.'
          }
          if ($deploySource -notmatch 'function Assert-StateDirectoryWritable') {
            throw 'Deployment state directories must be write-tested before storing secrets or backups.'
          }
          if ($deploySource -notmatch [regex]::Escape('$pendingEnvironment = Join-Path $configRoot "add-env-$stamp.new"')) {
            throw 'The pending protected environment must use a release-unique filename.'
          }
          if ($deploySource -match [regex]::Escape("'*S-1-5-20:(OI)(CI)M'")) {
            throw 'The restricted deployment principal must be able to maintain its protected state ACL.'
          }
          if ($deploySource -notmatch 'function Write-DockerFailureDiagnostics') {
            throw 'Failed containers must be logged before transactional rollback removes them.'
          }
          if ($deploySource -notmatch [regex]::Escape("'(?i)\b[a-f0-9]{64}\b'")) {
            throw 'Failure diagnostics must redact keyed lookup hashes and SHA-256 material.'
          }
          $deployWorkflowSource = Get-Content -LiteralPath '.github/workflows/add-deploy.yml' -Raw
          if ($deployWorkflowSource -match '(?m)^\s*docker compose[^\r\n]*\slogs(?:\s|$)') {
            throw 'The deploy workflow must not bypass deploy.ps1 log redaction.'
          }
          if ($deploySource -notmatch 'A failed first build can leave production-named tags') {
            throw 'Rollback images must be gated by completed-release metadata.'
          }
      - name: Parse the firmware signing vault script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'deploy/add/bootstrap-firmware-signing.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $messages = ($errors | ForEach-Object Message) -join [Environment]::NewLine
            throw "bootstrap-firmware-signing.ps1 contains parser errors:$([Environment]::NewLine)$messages"
          }
      - name: Parse the firmware release signing script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'deploy/add/sign-firmware-release.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $messages = ($errors | ForEach-Object Message) -join [Environment]::NewLine
            throw "sign-firmware-release.ps1 contains parser errors:$([Environment]::NewLine)$messages"
          }
      - name: Parse physical-provisioning publication scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            'deploy/add/publish-factory-firmware.ps1',
            'deploy/add/bootstrap-firmware-signing.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object Message) -join [Environment]::NewLine
              throw "$path contains parser errors:$([Environment]::NewLine)$messages"
            }
          }
      - name: Scan the committed worktree for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3
          dir /repo --no-banner --redact --exit-code 1

  backend-tests:
    name: backend-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Whole files are balanced by scripts/ci_test_durations.json. The
        # backend join pins the same count: every plan records its count and
        # must match, so a mismatch fails closed instead of skipping tests.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendance_devices
          POSTGRES_USER: add_service
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U add_service -d attendance_devices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ADD_DATABASE_URL: postgresql+psycopg://add_service@127.0.0.1:5432/attendance_devices
      ADD_REDIS_URL: redis://127.0.0.1:6379/0
      ADD_ADMIN_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Generate isolated test keys
        run: |
          python scripts/generate_ci_env.py /tmp/add-ci.env --github-env "$GITHUB_ENV"
          rm -f /tmp/add-ci.env
      - name: Run isolated test shard with whole-file coverage
        run: >-
          python scripts/run_ci_tests.py
          --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }}
          --weights scripts/ci_test_durations.json
          --plan-path .ci/test-plan-${{ matrix.shard }}.json
          --junit-path .ci/junit-${{ matrix.shard }}.xml
      - name: Preserve exact collection and shard assignment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-plan-${{ matrix.shard }}
          path: |
            .ci/test-plan-${{ matrix.shard }}.json
            .ci/junit-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  backend-static:
    # Lint, contracts, migrations and packaging need no test results, so they
    # start immediately and a lint failure is visible within minutes instead
    # of after the test shards. The exact `backend` check below still cannot
    # succeed unless this job succeeds.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendance_devices
          POSTGRES_USER: add_service
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U add_service -d attendance_devices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ADD_DATABASE_URL: postgresql+psycopg://add_service@127.0.0.1:5432/attendance_devices
      ADD_REDIS_URL: redis://127.0.0.1:6379/0
      ADD_ADMIN_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Generate isolated test keys
        run: |
          python scripts/generate_ci_env.py /tmp/add-ci.env --github-env "$GITHUB_ENV"
          rm -f /tmp/add-ci.env
      - name: Lint
        run: python -m ruff check apps/add_backend apps/add_provisioner apps/provisioning_companion tests scripts firmware/zone_lite/tools/provision_zone_lite.py
      - name: Verify frontend OpenAPI safety contracts
        run: python scripts/check_frontend_openapi_contract.py
      - name: Validate a fresh PostgreSQL migration and schema drift
        run: |
          alembic -c apps/add_backend/alembic.ini upgrade head
          alembic -c apps/add_backend/alembic.ini current
          alembic -c apps/add_backend/alembic.ini check
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["ADD_DATABASE_URL"])
          inspector = inspect(engine)
          assert "raw_name" not in {c["name"] for c in inspector.get_columns("add_device_users")}
          assert "payload" not in {c["name"] for c in inspector.get_columns("add_device_commands")}
          assert "device_user_id" in {c["name"] for c in inspector.get_columns("add_attendance_events")}
          assert "add_onboarding_nonces" in inspector.get_table_names()
          assert "add_identity_tombstones" in inspector.get_table_names()
          assert "add_provisioning_companions" in inspector.get_table_names()
          assert "add_provisioning_sessions" in inspector.get_table_names()
          assert "add_factory_firmware_bundles" in inspector.get_table_names()
          zkt_columns = {c["name"] for c in inspector.get_columns("add_zkt_devices")}
          assert {"terminal_binding_state", "confirmed_serial"} <= zkt_columns
          PY
      - name: Prove legacy duplicate CNIC migration preserves users and punches
        run: |
          python scripts/verify_duplicate_cnic_migration.py reset
          alembic -c apps/add_backend/alembic.ini upgrade 20260710_0001
          python scripts/verify_duplicate_cnic_migration.py prepare
          alembic -c apps/add_backend/alembic.ini upgrade head
          python scripts/verify_duplicate_cnic_migration.py verify
          alembic -c apps/add_backend/alembic.ini current
          alembic -c apps/add_backend/alembic.ini check
      - name: Build Python distribution
        run: python -m build

  backend:
    # This exact required check cannot succeed until EVERY isolated test shard,
    # their complete coverage proof, and every lint, contract, migration and
    # packaging gate in backend-static succeed. Signing still requires it.
    needs: [backend-tests, backend-static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every test shard and every static gate to succeed
        env:
          SHARD_RESULT: ${{ needs.backend-tests.result }}
          STATIC_RESULT: ${{ needs.backend-static.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$STATIC_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-test-plan-*
          path: .ci
          merge-multiple: true
      - name: Verify every collected test belongs to exactly one successful shard
        run: python scripts/run_ci_tests.py --verify-plans .ci --shard-count 8 --weights scripts/ci_test_durations.json
      - name: Warn when the committed shard weights are stale
        # Diagnostic only: it always exits 0 and runs after the coverage proof.
        # Stale weights slow a shard down but never change which tests run.
        run: python scripts/update_ci_test_durations.py --check scripts/ci_test_durations.json .ci/junit-*.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/add_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact frontend dependencies
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm install --frozen-lockfile
      - name: Run dashboard interaction tests
        run: pnpm test
      - name: Build production dashboard
        run: pnpm run build
      - name: Enforce frontend bundle budgets
        run: pnpm run budget
      - name: Install Playwright browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run responsive and accessibility browser tests
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: add-playwright-report
          path: apps/add_frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  firmware-production:
    # The firmware parts run in parallel on separate runners. Each original
    # build and its repeat stay on one runner, so every reproducibility proof
    # still compares two independent builds of the same checkout and image.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert secure firmware build defaults
        run: |
          grep -qx 'CONFIG_NVS_ENCRYPTION=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_NVS_SEC_KEY_PROTECT_USING_HMAC=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_SECURE_BOOT=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_SECURE_BOOT_V2_ENABLED=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_MBEDTLS_HKDF_C=y' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=n' firmware/zone_lite/sdkconfig.defaults
          grep -qx 'CONFIG_PARTITION_TABLE_OFFSET=0x10000' firmware/zone_lite/sdkconfig.defaults
          grep -q 'nvs.*0x11000.*0x6000' firmware/zone_lite/partitions.csv
          grep -q 'ota_0.*0x2A0000.*0x280000' firmware/zone_lite/partitions.csv
          grep -q 'ota_1.*0x520000.*0x280000' firmware/zone_lite/partitions.csv
      - name: Fault-test attendance serialization with the pinned cJSON
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project
          espressif/idf:v5.5.3
          python tests/firmware/tools/run_allocation_checks.py
      - name: Release a hidden SPIFFS file against ESP-IDF's own SPIFFS
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project:ro"
          -w /project
          espressif/idf:v5.5.3
          python tests/firmware/tools/check_spiffs_orphan.py
      - name: Repair power-cut damage against ESP-IDF's own SPIFFS
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project:ro"
          -w /project
          espressif/idf:v5.5.3
          python tests/firmware/tools/check_spiffs_repair.py
      - name: Verify journal AEAD with pinned mbedTLS and independent vectors
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project:ro"
          -w /project
          espressif/idf:v5.5.3
          python tests/firmware/tools/check_journal_crypto.py
      - name: Build ESP32-S3 production firmware with ESP-IDF 5.5.3
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'rm -rf build-ci && idf.py -B build-ci -D SDKCONFIG=/tmp/zone-lite-ci-sdkconfig build'
      - name: Build dedicated Hikvision ESP32-S3 firmware
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'idf.py -B build-ci-hikvision -D SDKCONFIG=/tmp/zone-lite-ci-hikvision-sdkconfig -D ZONE_LITE_FAMILY=hikvision build'
      - name: Check Hikvision application family descriptor
        run: python3 scripts/check_firmware_identity.py firmware/zone_lite/build-ci-hikvision/zone_lite_hikvision.bin --family hikvision
      - name: Record the ESP-IDF image digest this runner built with
        run: docker image inspect espressif/idf:v5.5.3 --format '{{json .RepoDigests}}'
      - name: Upload non-provisioned firmware build (best effort)
        # The build above is the release gate. Artifact retention is convenient for
        # diagnostics, but GitHub storage exhaustion must not block an unrelated ADD
        # production deployment; signed firmware releases use the separate vault flow.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zone-lite-esp32s3-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            firmware/zone_lite/build-ci/bootloader/bootloader.bin
            firmware/zone_lite/build-ci/partition_table/partition-table.bin
            firmware/zone_lite/build-ci/ota_data_initial.bin
            firmware/zone_lite/build-ci/zone_lite.bin
            firmware/zone_lite/build-ci/flasher_args.json

  firmware-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile gated ZKT journal writer (development only)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'idf.py -B build-ci-journal -D SDKCONFIG=/tmp/zone-lite-ci-journal-sdkconfig -D PROJECT_VER=2.7.0 -D ZONE_LITE_JOURNAL_WRITES=ON build'
      - name: Check candidate application identity
        run: python3 scripts/check_firmware_identity.py firmware/zone_lite/build-ci-journal/zone_lite.bin --family zkt --version 2.7.0
      - name: Rebuild the writer at a different path and compare unsigned artifacts
        env:
          REPRO_VARIANT: journal
          REPRO_VERSION: "2.7.0"
        run: |
          set -euo pipefail
          docker image inspect espressif/idf:v5.5.3 --format '{{json .RepoDigests}}'
          docker run --rm -e REPRO_VARIANT -e REPRO_VERSION \
            -v "$GITHUB_WORKSPACE:/rebuild" -w /rebuild/firmware/zone_lite \
            espressif/idf:v5.5.3 bash -lc \
            'idf.py -B "build-ci-$REPRO_VARIANT-repeat" -D "SDKCONFIG=/tmp/repeat-$REPRO_VARIANT-sdkconfig" -D "PROJECT_VER=$REPRO_VERSION" -D ZONE_LITE_JOURNAL_WRITES=ON build'
          python3 scripts/check_firmware_identity.py "firmware/zone_lite/build-ci-$REPRO_VARIANT-repeat/zone_lite.bin" --family zkt --version "$REPRO_VERSION"
          python3 scripts/check_firmware_reproducibility.py \
            "firmware/zone_lite/build-ci-$REPRO_VARIANT" "firmware/zone_lite/build-ci-$REPRO_VARIANT-repeat"

  firmware-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile capture-capable ZKT reader bridge (development only)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'idf.py -B build-ci-bridge -D SDKCONFIG=/tmp/zone-lite-ci-bridge-sdkconfig -D PROJECT_VER=2.6.23 -D ZONE_LITE_JOURNAL_WRITES=ON build'
      - name: Check bridge application identity
        run: python3 scripts/check_firmware_identity.py firmware/zone_lite/build-ci-bridge/zone_lite.bin --family zkt --version 2.6.23
      - name: Check actual Xtensa startup stack budgets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project
          espressif/idf:v5.5.3
          python3 scripts/check_zkt_startup_stack.py firmware/zone_lite/build-ci-bridge
      - name: Rebuild the bridge at a different path and compare unsigned artifacts
        env:
          REPRO_VARIANT: bridge
          REPRO_VERSION: "2.6.23"
        run: |
          set -euo pipefail
          docker image inspect espressif/idf:v5.5.3 --format '{{json .RepoDigests}}'
          docker run --rm -e REPRO_VARIANT -e REPRO_VERSION \
            -v "$GITHUB_WORKSPACE:/rebuild" -w /rebuild/firmware/zone_lite \
            espressif/idf:v5.5.3 bash -lc \
            'idf.py -B "build-ci-$REPRO_VARIANT-repeat" -D "SDKCONFIG=/tmp/repeat-$REPRO_VARIANT-sdkconfig" -D "PROJECT_VER=$REPRO_VERSION" -D ZONE_LITE_JOURNAL_WRITES=ON build'
          python3 scripts/check_firmware_identity.py "firmware/zone_lite/build-ci-$REPRO_VARIANT-repeat/zone_lite.bin" --family zkt --version "$REPRO_VERSION"
          python3 scripts/check_firmware_reproducibility.py \
            "firmware/zone_lite/build-ci-$REPRO_VARIANT" "firmware/zone_lite/build-ci-$REPRO_VARIANT-repeat"

  firmware-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile one-shot ZKT storage recovery role
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'idf.py -B build-ci-recovery -D SDKCONFIG=/tmp/zone-lite-ci-recovery-sdkconfig -D PROJECT_VER=2.6.27 -D ZONE_LITE_STORAGE_RECOVERY=ON build'
      - name: Check recovery application identity and exact compiled contract
        run: |
          python3 scripts/check_firmware_identity.py firmware/zone_lite/build-ci-recovery/zone_lite.bin --family zkt --version 2.6.27
          python3 -c "import sys; d=open(sys.argv[1],'rb').read(); m=b'ZONE_STORAGE_CONTRACT_V2:RECOVERY:READ=2:LANES=3F:BASE=2.5.2\0'; sys.exit(0 if d.count(m) == 1 and d.count(b'ZONE_STORAGE_CONTRACT_V') == 1 else 'recovery contract marker is missing or ambiguous')" firmware/zone_lite/build-ci-recovery/zone_lite.bin
      - name: Compile the ZKT 2.7.6 direct legacy role exactly as HIL signs it
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/zone_lite
          espressif/idf:v5.5.3
          bash -lc 'idf.py -B build-ci-direct -D SDKCONFIG=/tmp/zone-lite-ci-direct-sdkconfig -D PROJECT_VER=2.7.6 -D ZONE_LITE_DIRECT_LEGACY_UPGRADE=ON build'
      - name: Check 2.7.6 identity and its exact compiled rollback contract
        run: |
          python3 scripts/check_firmware_identity.py firmware/zone_lite/build-ci-direct/zone_lite.bin --family zkt --version 2.7.6
          python3 -c "import sys; d=open(sys.argv[1],'rb').read(); m=b'ZONE_STORAGE_CONTRACT_V2:LEGACY:READ=2:LANES=3F:BASE=2.4.12,2.5.2,2.6.6,2.6.7,2.6.8,2.6.9,2.6.10,2.6.12,2.6.13,2.6.14,2.6.15,2.7.2,2.7.3,2.7.4,2.7.5\0'; sys.exit(0 if d.count(m) == 1 and d.count(b'ZONE_STORAGE_CONTRACT_V') == 1 else 'direct contract marker is missing or ambiguous')" firmware/zone_lite/build-ci-direct/zone_lite.bin
      - name: Record the ESP-IDF image digest this runner built with
        run: docker image inspect espressif/idf:v5.5.3 --format '{{json .RepoDigests}}'
      - name: Compile quarantined USB Wi-Fi rescue and synthetic predecessor
        env:
          SLIC_RESCUE_WIFI_PASSWORD: HIL-Recovery-Only
        run: python3 scripts/build_usb_wifi_rescue.py --output build-ci-usb-rescue

  firmware:
    # This exact required check (HIL, signing and release gates match it by
    # name) cannot succeed unless every firmware part above succeeded.
    needs: [firmware-production, firmware-journal, firmware-bridge, firmware-roles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every firmware build, contract and reproducibility proof to succeed
        env:
          PRODUCTION_RESULT: ${{ needs.firmware-production.result }}
          JOURNAL_RESULT: ${{ needs.firmware-journal.result }}
          BRIDGE_RESULT: ${{ needs.firmware-bridge.result }}
          ROLES_RESULT: ${{ needs.firmware-roles.result }}
        run: |
          test "$PRODUCTION_RESULT" = success
          test "$JOURNAL_RESULT" = success
          test "$BRIDGE_RESULT" = success
          test "$ROLES_RESULT" = success

  oracle-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and execute the Oracle reader with synthetic data
        run: |
          python3 tests/oracle/oracle_test_container.py start --container zkt-oracle-ci
          python3 tests/oracle/run_projection_checks.py --container zkt-oracle-ci
      - name: Remove the isolated Oracle test database
        if: always()
        run: python3 tests/oracle/oracle_test_container.py stop --container zkt-oracle-ci

  containers:
    # Uses no artifact or result from another job, so it starts immediately.
    # It remains one of the exact required checks, and Deploy ADD still runs
    # only after the whole workflow, every job included, has succeeded.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment generator dependencies
        run: python -m pip install --disable-pip-version-check argon2-cffi cryptography
      - name: Create disposable Compose environment
        run: python scripts/generate_ci_env.py .env.add
      - name: Validate Compose model and public bindings
        run: |
          docker compose --env-file .env.add -f docker-compose.add.yml config --quiet
          docker compose --env-file .env.add -f docker-compose.add.yml config --format json |
            python3 scripts/check_compose_config.py
      - name: Build and smoke-test the complete stack
        run: |
          set -euo pipefail
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker compose --env-file .env.add -f docker-compose.add.yml ps || true
              docker compose --env-file .env.add -f docker-compose.add.yml logs --tail=250 || true
            fi
            docker compose --env-file .env.add -f docker-compose.add.yml down -v --remove-orphans || true
            rm -f .env.add
            exit "$result"
          }
          trap cleanup EXIT
          docker compose --env-file .env.add -f docker-compose.add.yml up -d --build --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:8096/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8095/health/ui
          curl --fail --silent --show-error http://127.0.0.1:8095/ | grep -q 'Attendance Device Dashboard'
          docker compose --env-file .env.add -f docker-compose.add.yml exec -T add-api alembic -c apps/add_backend/alembic.ini current
