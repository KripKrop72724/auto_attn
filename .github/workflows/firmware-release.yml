name: Zone Lite signed firmware release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact green main commit to build
        required: true
        type: string
      version:
        description: SemVer firmware version, without a v prefix
        required: true
        type: string
      hil_run_id:
        description: Successful Zone Lite OTA hardware-gate run ID for this commit
        required: true
        type: string
      publish_disaster_recovery_copy:
        description: Also create an immutable GitHub release copy
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: zone-lite-firmware-release
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Require exact main SHA and successful HIL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          sha="$(git rev-parse '${{ inputs.commit_sha }}^{commit}')"
          git merge-base --is-ancestor "$sha" origin/main
          run_json="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.hil_run_id }}")"
          test "$(jq -r .name <<<"$run_json")" = "Zone Lite OTA hardware gate"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: provenance
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build the exact unsigned candidate
        working-directory: firmware/zone_lite
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^project(zone_lite VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)" = "${{ inputs.version }}"
          idf.py -B build-release -D SDKCONFIG=/tmp/zone-lite-release-sdkconfig build
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-release-unsigned-${{ needs.provenance.outputs.sha }}
          path: firmware/zone_lite/build-release/zone_lite.bin
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [provenance, build]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-signing
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-release-unsigned-${{ needs.provenance.outputs.sha }}
          path: unsigned
      - name: Sign with the ADD-hosted DPAPI vault
        run: |
          $ErrorActionPreference = 'Stop'
          $vault = Join-Path $env:ProgramData 'StateLife\AttendanceDeviceDashboard\firmware-signing'
          $unsigned = Join-Path $PWD 'unsigned\firmware\zone_lite\build-release'
          $output = Join-Path $PWD 'release'
          ./deploy/add/sign-firmware-release.ps1 `
            -VaultDirectory $vault `
            -UnsignedDirectory $unsigned `
            -OutputDirectory $output `
            -Version '${{ inputs.version }}' `
            -GitSha '${{ needs.provenance.outputs.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-${{ inputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-add:
    needs: [provenance, sign]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-${{ inputs.version }}
          path: firmware-release
      - name: Atomically publish to the ADD firmware store
        shell: powershell
        env:
          ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
        run: |
          if (-not $env:ADD_FIRMWARE_STORE_HOST_PATH) { throw "ADD_FIRMWARE_STORE_HOST_PATH is not configured" }
          ./deploy/add/publish-firmware.ps1 `
            -SourceDirectory firmware-release `
            -StoreDirectory $env:ADD_FIRMWARE_STORE_HOST_PATH `
            -Version "${{ inputs.version }}"

  disaster-recovery-copy:
    if: ${{ inputs.publish_disaster_recovery_copy }}
    needs: [provenance, sign, publish-add]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-${{ inputs.version }}
          path: release
      - name: Publish immutable disaster-recovery copy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zone-lite-v${{ inputs.version }}"
          ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1
          gh release create "$tag" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ needs.provenance.outputs.sha }}" \
            --title "Zone Lite ${{ inputs.version }}" \
            --notes "Signed production firmware. Promotion requires an approved per-zone campaign in ADD."
