name: Zone Lite signed firmware release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact green main commit already tested as an immutable HIL candidate
        required: true
        type: string
      version:
        description: SemVer firmware version, without a v prefix
        required: true
        type: string
      hil_run_id:
        description: Successful Zone Lite OTA hardware-gate run ID for this commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: zone-lite-firmware-release
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Require exact main SHA and successful physical HIL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          sha="$(git rev-parse '${{ inputs.commit_sha }}^{commit}')"
          git merge-base --is-ancestor "$sha" origin/main
          run_json="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.hil_run_id }}")"
          test "$(jq -r .name <<<"$run_json")" = "Zone Lite OTA hardware gate"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  promote-add:
    needs: provenance
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Promote the exact HIL-tested bytes
        shell: powershell
        env:
          ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
        run: |
          if (-not $env:ADD_FIRMWARE_STORE_HOST_PATH) { throw "ADD_FIRMWARE_STORE_HOST_PATH is not configured" }
          ./deploy/add/promote-firmware.ps1 `
            -StoreDirectory $env:ADD_FIRMWARE_STORE_HOST_PATH `
            -Version "${{ inputs.version }}" `
            -GitSha "${{ needs.provenance.outputs.sha }}" `
            -OutputDirectory promoted-release
          if (Test-Path -LiteralPath 'promoted-release/.hil-only.json') {
            throw 'Promoted production package is still HIL-targeted.'
          }
