name: Provisioning companion release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Companion SemVer without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provisioning-companion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    environment: firmware-signing
    env:
      ADD_COMPANION_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.ADD_COMPANION_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the native architecture and exact package version
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(python -c 'import tomllib; print(tomllib.load(open("apps/provisioning_companion/pyproject.toml", "rb"))["project"]["version"])')" = "${{ inputs.version }}"
          arch="$(python -c 'import platform; print(platform.machine().lower())')"
          case "$TARGET_PLATFORM" in
            windows-x64) [[ "$arch" = "amd64" || "$arch" = "x86_64" ]] ;;
            macos-arm64) test "$arch" = "arm64" ;;
            *) echo "Unsupported release platform: $TARGET_PLATFORM" >&2; exit 1 ;;
          esac
          python -c 'import platform; print(platform.platform(), platform.machine())'
      - name: Install exact native build dependencies
        run: python -m pip install ./apps/provisioning_companion[build,dev]
      - name: Run companion unit tests
        run: python -m pytest -q tests/companion
      - name: Build unsigned native companion and pinned Espressif sidecars
        run: python apps/provisioning_companion/build_native.py
      - name: Package Windows x64
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler -PathType Leaf)) { throw 'Pinned Inno Setup 6 is unavailable' }
          & $compiler "/DMyAppVersion=${{ inputs.version }}" 'apps/provisioning_companion/windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows companion installer build failed' }
          Move-Item 'apps/provisioning_companion/dist/add-provisioning-companion-windows-x64.exe' .
      - name: Package macOS arm64
        if: matrix.platform == 'macos-arm64'
        run: ditto -c -k --keepParent 'apps/provisioning_companion/dist/ADD Provisioning Companion.app' 'add-provisioning-companion-macos-arm64.zip'
      - name: Build cryptographically signed release manifest
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows-x64 ]; then extension=exe; else extension=zip; fi
          python scripts/build_companion_release_manifest.py --artifact "add-provisioning-companion-${{ matrix.platform }}.$extension" --platform "${{ matrix.platform }}" --version "${{ inputs.version }}" --output "release-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.platform }}-${{ inputs.version }}
          path: release-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        platform: [windows-x64, macos-arm64]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated release-verification environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The production runner is deliberately unprivileged. setup-python's
          # Windows installer edits HKLM and cannot run as NETWORK SERVICE, while
          # the runner's existing Python can create a workspace-local venv.
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'The production runner Python is unavailable' }
          python -m venv .companion-release-verify
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release verification environment' }
          .\.companion-release-verify\Scripts\python.exe -m pip install `
            --disable-pip-version-check cryptography==49.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the release verification dependency' }
      - uses: actions/download-artifact@v4
        with:
          name: companion-${{ matrix.platform }}-${{ inputs.version }}
          path: companion-candidate
      - name: Verify and atomically publish immutable companion release
        shell: pwsh
        env:
          ADD_COMPANION_RELEASE_STORE_HOST_PATH: ${{ vars.ADD_COMPANION_RELEASE_STORE_HOST_PATH }}
          ADD_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64: ${{ vars.ADD_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          if (-not $env:ADD_COMPANION_RELEASE_STORE_HOST_PATH) { throw 'Companion release store is not configured' }
          if (-not $env:ADD_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64) { throw 'Companion release verification key is not configured' }
          .\.companion-release-verify\Scripts\python.exe scripts/publish_companion_release.py `
            --source companion-candidate `
            --store $env:ADD_COMPANION_RELEASE_STORE_HOST_PATH `
            --public-key-b64 $env:ADD_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64
