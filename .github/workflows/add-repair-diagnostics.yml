name: ADD read-only repair diagnostics

on:
  workflow_dispatch:
    inputs:
      direct_run_id:
        description: 'Optional saved direct Oracle send run ID for bounded error-code diagnostics'
        required: false
        type: string
      attendance_event_id:
        description: 'Optional comma-separated attendance row IDs (up to 30) for boolean-only CNIC guard diagnostics'
        required: false
        type: string
      normal_oracle_content_check:
        description: 'Opt in to read-only Oracle content checks for exact attendance row IDs (up to 30); never sends attendance'
        required: false
        default: false
        type: boolean
      firmware_campaign_id:
        description: 'Optional exact firmware campaign ID for read-only assignment diagnostics'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: add-repair-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    environment: add-production
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read container state and bounded database counters
        env:
          DIRECT_RUN_ID: ${{ inputs.direct_run_id }}
          ATTENDANCE_EVENT_ID: ${{ inputs.attendance_event_id }}
          NORMAL_ORACLE_CONTENT_CHECK: ${{ inputs.normal_oracle_content_check }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'attendance-device-dashboard-add-api-1'
          $web = 'attendance-device-dashboard-add-web-1'
          foreach ($container in @($api, $web)) {
            & docker inspect --format '{{.Name}} status={{.State.Status}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' $container
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect an ADD container.' }
            # Health output may contain arbitrary errors. Publish fixed markers only.
            $state = (& docker inspect $container | ConvertFrom-Json)[0].State
            Write-Host "exit_code=$($state.ExitCode) started=$($state.StartedAt) health=$($state.Health.Status) health_failures=$($state.Health.FailingStreak)"
            foreach ($probe in @($state.Health.Log)) {
              $restart = [bool]($probe.Output -match 'restarting API process')
              Write-Host "probe_start=$($probe.Start) exit_code=$($probe.ExitCode) self_restart=$restart"
            }
          }
          & docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}}' $api $web
          if ($LASTEXITCODE -ne 0) { throw 'Could not read bounded container resource counters.' }
          $script = Get-Content -Raw -Encoding UTF8 'scripts/attendance_repair_diagnostics.py'
          if ([string]::IsNullOrWhiteSpace($script)) { throw 'Read-only diagnostic source is empty.' }
          $diagnosticArgs = @()
          if ($env:ATTENDANCE_EVENT_ID) {
            $diagnosticArgs += @('--attendance-event-id', $env:ATTENDANCE_EVENT_ID)
          }
          if ($env:DIRECT_RUN_ID) {
            $diagnosticArgs += @('--direct-run-id', $env:DIRECT_RUN_ID)
          }
          if ($env:NORMAL_ORACLE_CONTENT_CHECK -eq 'true') {
            $diagnosticArgs += '--normal-oracle-content-check'
          }
          $scriptPath = "/tmp/add-repair-state-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.py"
          $previousEncoding = $OutputEncoding
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $installed = $false
          $diagnosticFailed = $false
          try {
            # Use the same file invocation as the log summary; Python must not
            # execute a possibly empty/truncated Windows Docker stdin stream.
            $script | & docker exec -i $api python -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(sys.stdin.buffer.read())' $scriptPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the temporary diagnostic script.' }
            $installed = $true
            # Keep stdout in memory until the sanitized report is validated.
            try { $reportLines = @(& docker exec $api python $scriptPath @diagnosticArgs 2>$null) }
            catch { throw 'Read-only database diagnostics failed.' }
            if ($LASTEXITCODE -ne 0) { throw 'Read-only database diagnostics failed.' }
            $reportText = $reportLines -join "`n"
            if ([string]::IsNullOrWhiteSpace($reportText)) { throw 'Read-only diagnostics returned no report.' }
            try { $report = $reportText | ConvertFrom-Json -ErrorAction Stop }
            catch { throw 'Read-only diagnostics returned an invalid JSON report.' }
            if ($null -eq $report -or $report -isnot [System.Management.Automation.PSCustomObject] -or
                $report.PSObject.Properties.Name -notcontains 'flags') {
              throw 'Read-only diagnostics returned an invalid report object.'
            }
            if ($env:NORMAL_ORACLE_CONTENT_CHECK -eq 'true') {
              $normal = $report.normal_oracle_check
              if ($null -eq $normal -or $normal -isnot [System.Management.Automation.PSCustomObject] -or
                  $normal.failed -isnot [bool] -or
                  ($normal.PSObject.Properties.Name -contains 'configured' -and $normal.configured -isnot [bool])) {
                throw 'Normal Oracle content diagnostics returned an invalid report object.'
              }
              $expectedIds = @($env:ATTENDANCE_EVENT_ID.Split(',') | ForEach-Object { [long]$_ } | Select-Object -Unique)
              $rows = @($normal.rows)
              $actualIds = @($rows | ForEach-Object {
                if ($null -eq $_ -or ($_.event_id -isnot [long] -and $_.event_id -isnot [int])) {
                  throw 'Normal Oracle content diagnostics returned an invalid event ID.'
                }
                [long]$_.event_id
              })
              if ($expectedIds.Count -eq 0 -or $rows.Count -ne $expectedIds.Count -or
                  @($actualIds | Select-Object -Unique).Count -ne $actualIds.Count -or
                  @(Compare-Object $expectedIds $actualIds).Count -ne 0) {
                throw 'Normal Oracle content diagnostics did not return the exact requested events.'
              }
            }
            Write-Output $reportText
            if ($env:NORMAL_ORACLE_CONTENT_CHECK -eq 'true') {
              if ($normal.failed -ne $false -or $normal.configured -ne $true) {
                throw 'Normal Oracle content diagnostics are unavailable or unconfigured.'
              }
              if (@($rows | Where-Object { $_.checked -eq $true }).Count -eq 0) {
                throw 'Normal Oracle content diagnostics performed no checks.'
              }
            }
          } catch {
            $diagnosticFailed = $true
            throw
          } finally {
            $OutputEncoding = $previousEncoding
            if ($installed) {
              & docker exec $api python -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).unlink(missing_ok=True)' $scriptPath
              if ($LASTEXITCODE -ne 0 -and -not $diagnosticFailed) { throw 'Could not remove the temporary diagnostic script.' }
            }
          }

      - name: Check protected Oracle verification capability without sending attendance
        env:
          REPAIR_USER: ${{ secrets.ADD_ATTENDANCE_REPAIR_ORDS_USERNAME }}
          REPAIR_PASSWORD: ${{ secrets.ADD_ATTENDANCE_REPAIR_ORDS_PASSWORD }}
        run: |
          if (-not $env:REPAIR_USER -or -not $env:REPAIR_PASSWORD) {
            Write-Host 'oracle_content_check=NOT_CONFIGURED'
            exit 0
          }
          try {
            $response = Invoke-WebRequest `
              -Uri 'https://local.slichealth.com/ords/slic_hrm/raw_attn_capture_event/raw-captures/identity-repairs/capabilities' `
              -Method Get -UseBasicParsing -TimeoutSec 15 `
              -Headers @{ 'X-API-Username' = $env:REPAIR_USER; 'X-API-Password' = $env:REPAIR_PASSWORD }
            $body = $response.Content | ConvertFrom-Json
            Write-Host "oracle_content_check_http=$([int]$response.StatusCode) contract=$($body.contract_version) raw_content_verification=$([bool]$body.raw_content_verification)"
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'TRANSPORT_ERROR' }
            Write-Host "oracle_content_check_http=$status"
          }

      - name: Inspect one firmware assignment without changing deployment state
        if: inputs.firmware_campaign_id != ''
        env:
          CAMPAIGN_ID: ${{ inputs.firmware_campaign_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CAMPAIGN_ID -notmatch '^[0-9a-f]{32}$') { throw 'Invalid campaign ID.' }
          $script = Get-Content -Raw 'scripts/firmware_assignment_diagnostics.py'
          $script | & docker exec -i attendance-device-dashboard-add-api-1 python - --campaign-id $env:CAMPAIGN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Read-only firmware diagnostics failed.' }

      - name: Summarize HTTP failures without exposing raw logs
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'attendance-device-dashboard-add-api-1'
          $script = Get-Content -Raw -Encoding UTF8 'scripts/attendance_repair_diagnostics.py'
          $scriptPath = "/tmp/add-repair-diagnostics-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.py"
          $previousEncoding = $OutputEncoding
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $installed = $false
          $summaryFailed = $false
          try {
            # Source travels on stdin; the native command stays below Windows' argv limit.
            $script | & docker exec -i $api python -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(sys.stdin.buffer.read())' $scriptPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the temporary diagnostic script.' }
            $installed = $true
            foreach ($container in @($api, 'attendance-device-dashboard-add-web-1')) {
              # cmd combines native stdout/stderr before PowerShell receives it.
              # Raw text stays in memory and is never written to workflow output.
              $raw = @(& cmd /c "docker logs --since 15m --tail 5000 $container 2>&1")
              if ($LASTEXITCODE -ne 0) { throw 'Could not read bounded container logs.' }
              Write-Host "Allowlisted summary: $container"
              $raw | & docker exec -i $api python $scriptPath --logs
              if ($LASTEXITCODE -ne 0) { throw 'Log summarization failed.' }
            }
          } catch {
            $summaryFailed = $true
            throw
          } finally {
            $OutputEncoding = $previousEncoding
            if ($installed) {
              & docker exec $api python -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).unlink(missing_ok=True)' $scriptPath
              if ($LASTEXITCODE -ne 0 -and -not $summaryFailed) { throw 'Could not remove the temporary diagnostic script.' }
            }
          }
