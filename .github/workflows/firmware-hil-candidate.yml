name: Zone Lite quarantined HIL candidate

on:
  workflow_dispatch:
    inputs:
      firmware_family:
        description: Terminal firmware family
        required: true
        default: zkt
        type: choice
        options: [zkt, hikvision]
      commit_sha:
        description: Exact green main commit to build
        required: true
        type: string
      version:
        description: SemVer firmware version, without a v prefix
        required: true
        type: string
      device_mac:
        description: Legacy single-target ESP MAC; leave empty for ordered targets
        required: false
        type: string
      targets_json:
        description: Ordered exact targets as JSON (connector_id, mac, terminal_serial); mutually exclusive with device_mac
        required: false
        type: string
      signed_candidate_run_id:
        description: Optional completed candidate run whose existing signed bytes should be published without rebuilding
        required: false
        type: string

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: zone-lite-hil-candidate
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      mac: ${{ steps.provenance.outputs.mac }}
      targets: ${{ steps.provenance.outputs.targets }}
      reuse_run: ${{ steps.reuse.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Require exact green main SHA, version, and HIL scope
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MAC: ${{ inputs.device_mac }}
          INPUT_TARGETS: ${{ inputs.targets_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          sha="$(git rev-parse "$INPUT_SHA^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" > /tmp/hil-checks.json
          python3 - <<'PYCODE'
          import json, os, re
          checks = json.load(open('/tmp/hil-checks.json'))['check_runs']
          for name in ('repository-contract', 'windows-publication', 'firmware', 'backend', 'frontend', 'oracle-projection', 'containers'):
              matching = [row for row in checks if row['name'] == name and row['app']['slug'] == 'github-actions']
              if not matching or max(matching, key=lambda row: row['id'])['conclusion'] != 'success':
                  raise SystemExit(f'Exact-commit CI is not green: {name}')
          mac = os.environ['INPUT_MAC'].strip().lower()
          raw = os.environ['INPUT_TARGETS'].strip()
          if bool(mac) == bool(raw):
              raise SystemExit('Supply legacy MAC or ordered targets, not both')
          if mac and not re.fullmatch(r'(?:[0-9a-f]{2}:){5}[0-9a-f]{2}', mac):
              raise SystemExit('Invalid HIL MAC')
          targets = json.loads(raw) if raw else None
          journal_bridge = os.environ['INPUT_VERSION'] in {'2.6.16', '2.6.17', '2.6.18', '2.6.19', '2.7.0'}
          target_limit = 17 if journal_bridge else 8
          if journal_bridge:
              expected = json.load(open('deploy/add/hil-targets-zkt-270.json'))
              if not isinstance(targets, list) or not targets or targets != expected[:len(targets)]:
                  raise SystemExit('Journal bridge requires its exact ordered nationwide prefix')
          if targets is not None:
              if not isinstance(targets, list) or not 1 <= len(targets) <= target_limit:
                  raise SystemExit('Invalid ordered target list')
              for row in targets:
                  if not isinstance(row, dict) or set(row) != {'connector_id', 'mac', 'terminal_serial'}:
                      raise SystemExit('Invalid target fields')
                  for key, limit in (('connector_id', 100), ('terminal_serial', 120), ('mac', 17)):
                      value = row[key]
                      if not isinstance(value, str) or not 1 <= len(value) <= limit or value != value.strip() or any(ord(c) < 32 for c in value):
                          raise SystemExit('Invalid exact target identity')
                  row['mac'] = row['mac'].lower()
                  if not re.fullmatch(r'(?:[0-9a-f]{2}:){5}[0-9a-f]{2}', row['mac']):
                      raise SystemExit('Invalid target MAC')
              if any(len({row[key] for row in targets}) != len(targets) for key in targets[0]):
                  raise SystemExit('Duplicate target identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mac=' + mac + '\n')
              output.write('targets=' + (json.dumps(targets, separators=(',', ':')) if targets else '') + '\n')
          PYCODE
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: reuse
        if: inputs.signed_candidate_run_id != ''
        name: Require the original completed build and signature artifact
        shell: bash
        env:
          REUSE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" > /tmp/hil-reuse-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?filter=latest&per_page=100" > /tmp/hil-reuse-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts?per_page=100" > /tmp/hil-reuse-artifacts.json
          python3 scripts/check_hil_signed_reuse.py "$REUSE_RUN_ID" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" \
            /tmp/hil-reuse-run.json /tmp/hil-reuse-jobs.json /tmp/hil-reuse-artifacts.json >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$(jq -r .head_sha /tmp/hil-reuse-run.json)" origin/main

  build:
    needs: provenance
    if: needs.provenance.outputs.reuse_run == ''
    runs-on: ubuntu-latest
    environment: firmware-signing
    env:
      FIRMWARE_FAMILY: ${{ inputs.firmware_family }}
      ZONE_LITE_SETUP_PASSWORD: ${{ secrets.ZONE_LITE_SETUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run large-catalog rollout preflight
        run: python3 tests/firmware/test_identity_catalog_rollout_preflight.py
      - name: Run Oracle reconcile load preflight
        run: python3 tests/firmware/test_oracle_reconcile_load_preflight.py
      - name: Build the exact unsigned candidate
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        working-directory: firmware/zone_lite
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZONE_LITE_SETUP_PASSWORD"
          project=zone_lite
          if [[ "$FIRMWARE_FAMILY" == "hikvision" ]]; then project=zone_lite_hikvision; fi
          actual="$(sed -n "s/^project($project VERSION \([^ )]*\).*/\1/p" CMakeLists.txt)"
          journal_mode=OFF
          if [[ "$FIRMWARE_FAMILY" == "zkt" && ( "$EXPECTED_VERSION" == "2.6.16" || "$EXPECTED_VERSION" == "2.6.17" || "$EXPECTED_VERSION" == "2.6.18" || "$EXPECTED_VERSION" == "2.6.19" || "$EXPECTED_VERSION" == "2.7.0" ) ]]; then
            journal_mode=ON
          else
            test "$actual" = "$EXPECTED_VERSION"
          fi
          storage_mode=OFF
          if [[ "$EXPECTED_VERSION" == "2.6.0" ]]; then storage_mode=ON; fi
          direct_mode=OFF
          if [[ "$FIRMWARE_FAMILY" == "zkt" && ( "$EXPECTED_VERSION" == "2.6.1" || "$EXPECTED_VERSION" == "2.6.2" || "$EXPECTED_VERSION" == "2.6.3" || "$EXPECTED_VERSION" == "2.6.4" || "$EXPECTED_VERSION" == "2.6.5" || "$EXPECTED_VERSION" == "2.6.6" || "$EXPECTED_VERSION" == "2.6.7" || "$EXPECTED_VERSION" == "2.6.8" || "$EXPECTED_VERSION" == "2.6.9" || "$EXPECTED_VERSION" == "2.6.10" || "$EXPECTED_VERSION" == "2.6.11" || "$EXPECTED_VERSION" == "2.6.12" || "$EXPECTED_VERSION" == "2.6.13" || "$EXPECTED_VERSION" == "2.6.14" || "$EXPECTED_VERSION" == "2.6.15" ) ]]; then direct_mode=ON; fi
          docker run --rm \
            -e ZONE_LITE_SEGMENTED_WRITES="$storage_mode" \
            -e ZONE_LITE_DIRECT_LEGACY_UPGRADE="$direct_mode" \
            -e ZONE_LITE_JOURNAL_WRITES="$journal_mode" \
            -e EXPECTED_VERSION \
            -e FIRMWARE_FAMILY \
            -e ZONE_LITE_SETUP_PASSWORD \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/firmware/zone_lite \
            espressif/idf:v5.5.3 \
            bash -lc 'rm -rf build-hil-release && idf.py -B build-hil-release -D SDKCONFIG=/tmp/zone-lite-hil-release-sdkconfig -D PROJECT_VER="$EXPECTED_VERSION" -D ZONE_LITE_SEGMENTED_WRITES="$ZONE_LITE_SEGMENTED_WRITES" -D ZONE_LITE_DIRECT_LEGACY_UPGRADE="$ZONE_LITE_DIRECT_LEGACY_UPGRADE" -D ZONE_LITE_JOURNAL_WRITES="$ZONE_LITE_JOURNAL_WRITES" -D ZONE_LITE_FAMILY="$FIRMWARE_FAMILY" build'
      - name: Verify built family and requested application version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          project=zone_lite
          if [[ "$FIRMWARE_FAMILY" == "hikvision" ]]; then project=zone_lite_hikvision; fi
          python3 scripts/check_firmware_identity.py "firmware/zone_lite/build-hil-release/$project.bin" --family "$FIRMWARE_FAMILY" --version "$EXPECTED_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-hil-unsigned-${{ needs.provenance.outputs.sha }}
          path: firmware/zone_lite/build-hil-release/${{ inputs.firmware_family == 'hikvision' && 'zone_lite_hikvision' || 'zone_lite' }}.bin
          if-no-files-found: error
          retention-days: 1
      - name: Preserve symbols for the exact unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: zone-lite-hil-symbols-${{ inputs.version }}-${{ needs.provenance.outputs.sha }}
          path: |
            firmware/zone_lite/build-hil-release/*.elf
            firmware/zone_lite/build-hil-release/*.map
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: [provenance, build]
    if: needs.provenance.outputs.reuse_run == ''
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-signing
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-hil-unsigned-${{ needs.provenance.outputs.sha }}
          path: unsigned
      - name: Sign the immutable HIL candidate with the ADD vault
        env:
          FIRMWARE_FAMILY: ${{ inputs.firmware_family }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.sha }}
          HIL_TARGETS_JSON: ${{ needs.provenance.outputs.targets }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vault = Join-Path $env:ProgramData 'StateLife\AttendanceDeviceDashboard\firmware-signing'
          $unsigned = Join-Path $PWD 'unsigned'
          $output = Join-Path $PWD 'release'
          ./deploy/add/sign-firmware-release.ps1 `
            -VaultDirectory $vault `
            -UnsignedDirectory $unsigned `
            -OutputDirectory $output `
            -Version $env:RELEASE_VERSION `
            -GitSha $env:RELEASE_SHA `
            -FirmwareFamily $env:FIRMWARE_FAMILY `
            -HilTargetsJson $env:HIL_TARGETS_JSON
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-${{ inputs.version }}-hil-only
          path: release/
          if-no-files-found: error
          # The shared setup credential is embedded for WPA2 operation. Keep
          # transient CI transport short-lived; durable bytes live only in ADD.
          retention-days: 1

  publish-hil:
    needs: [provenance, sign]
    if: always() && needs.provenance.result == 'success' && (needs.sign.result == 'success' || needs.provenance.outputs.reuse_run != '')
    # Admission and publication must observe one deployed backend. Share the
    # production deployment lock so a backend replacement cannot race them.
    concurrency:
      group: add-production
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          # Publication tooling can be repaired without changing signed bytes.
          # The manifest below must still match the exact green firmware SHA.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify publication transfer failure handling
        shell: powershell
        run: ./tests/firmware/test_deployed_firmware_contract.ps1
      - uses: actions/download-artifact@v4
        if: needs.provenance.outputs.reuse_run == ''
        with:
          name: zone-lite-${{ inputs.version }}-hil-only
          path: firmware-release
      - uses: actions/download-artifact@v4
        if: needs.provenance.outputs.reuse_run != ''
        with:
          name: zone-lite-${{ inputs.version }}-hil-only
          path: firmware-release
          run-id: ${{ needs.provenance.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Match preserved signed metadata to the requested release
        shell: powershell
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.sha }}
          FIRMWARE_FAMILY: ${{ inputs.firmware_family }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'firmware-release/manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:RELEASE_VERSION -or $manifest.git_sha -cne $env:RELEASE_SHA -or
              $manifest.firmware_family -cne $env:FIRMWARE_FAMILY) {
            throw 'Signed candidate does not match the requested firmware identity.'
          }
      - name: Verify the deployed ADD admits this signed contract
        shell: powershell
        run: ./deploy/add/check-deployed-firmware-contract.ps1 -SourceDirectory firmware-release
      - name: Atomically publish for the exact HIL scope
        shell: powershell
        env:
          ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
          RELEASE_VERSION: ${{ inputs.version }}
          HIL_TARGET_MAC: ${{ needs.provenance.outputs.mac }}
          HIL_TARGETS_JSON: ${{ needs.provenance.outputs.targets }}
        run: |
          if (-not $env:ADD_FIRMWARE_STORE_HOST_PATH) { throw "ADD_FIRMWARE_STORE_HOST_PATH is not configured" }
          ./deploy/add/publish-firmware.ps1 `
            -SourceDirectory firmware-release `
            -StoreDirectory $env:ADD_FIRMWARE_STORE_HOST_PATH `
            -Version $env:RELEASE_VERSION `
            -PublicationMode HIL_ONLY `
            -HilTargetMac $env:HIL_TARGET_MAC `
            -HilTargetsJson $env:HIL_TARGETS_JSON
