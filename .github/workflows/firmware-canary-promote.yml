name: Zone Lite production canary promotion

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact green main commit used to build the HIL_ONLY candidate
        required: true
        type: string
      version:
        description: SemVer firmware version, without a v prefix
        required: true
        type: string
      campaign_id:
        description: Closed production-canary campaign with one successful deployment
        required: true
        type: string
      zone_id:
        description: Exact canary zone
        required: true
        type: string
      device_mac:
        description: Exact canary ESP MAC
        required: true
        type: string
      minimum_terminal_attendance:
        description: Fail closed if the canary reports fewer preserved terminal punches
        required: true
        type: number
      minimum_source_exceptions:
        description: Known poison rows that must be visible and safely advanced in ADD
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: zone-lite-firmware-release
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      mac: ${{ steps.provenance.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Require exact main SHA and normalized release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.campaign_id }}" =~ ^[0-9a-f]{32}$ ]]
          [[ "${{ inputs.zone_id }}" =~ ^ZONE-[A-Z0-9-]+$ ]]
          mac="$(tr '[:upper:]' '[:lower:]' <<<"${{ inputs.device_mac }}")"
          [[ "$mac" =~ ^([0-9a-f]{2}:){5}[0-9a-f]{2}$ ]]
          test "${{ inputs.minimum_terminal_attendance }}" -ge 1
          git fetch origin main
          sha="$(git rev-parse '${{ inputs.commit_sha }}^{commit}')"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  verify-production-canary:
    needs: provenance
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    timeout-minutes: 10
    env:
      ADD_BASE_URL: http://127.0.0.1:8096
      ADD_ADMIN_USERNAME: StateHealthAdmin
      ADD_ADMIN_PASSWORD: ${{ secrets.ADD_CANARY_ADMIN_PASSWORD }}
      EXPECTED_SHA: ${{ needs.provenance.outputs.sha }}
      EXPECTED_MAC: ${{ needs.provenance.outputs.mac }}
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_CAMPAIGN: ${{ inputs.campaign_id }}
      EXPECTED_ZONE: ${{ inputs.zone_id }}
      MINIMUM_TERMINAL_ATTENDANCE: ${{ inputs.minimum_terminal_attendance }}
      MINIMUM_SOURCE_EXCEPTIONS: ${{ inputs.minimum_source_exceptions }}
    steps:
      - name: Verify exact successful canary and stable live operation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ADD_ADMIN_PASSWORD) {
            throw 'ADD_CANARY_ADMIN_PASSWORD is not configured in firmware-production.'
          }
          $loginBody = @{
            username = $env:ADD_ADMIN_USERNAME
            password = $env:ADD_ADMIN_PASSWORD
          } | ConvertTo-Json -Compress
          $loginResponse = Invoke-WebRequest `
            -UseBasicParsing `
            -Method Post `
            -Uri "$env:ADD_BASE_URL/api/v1/auth/login" `
            -ContentType 'application/json' `
            -Body $loginBody `
            -TimeoutSec 30
          $login = $loginResponse.Content | ConvertFrom-Json
          if (-not $login.ok -or $login.username -ne $env:ADD_ADMIN_USERNAME -or
              [string]::IsNullOrWhiteSpace([string]$login.csrf_token)) {
            throw 'Production canary verifier could not establish an authenticated ADD session.'
          }
          $setCookie = @($loginResponse.Headers['Set-Cookie']) -join ','
          $cookieMatch = [regex]::Match(
            $setCookie,
            '(?:^|[,\s])add_admin=([^;,\s]+)'
          )
          if (-not $cookieMatch.Success) {
            throw 'Production canary verifier did not receive the ADD administrator cookie.'
          }
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $adminCookie = New-Object System.Net.Cookie
          $adminCookie.Name = 'add_admin'
          $adminCookie.Value = $cookieMatch.Groups[1].Value
          $adminCookie.Path = '/'
          $adminCookie.Secure = $false
          $session.Cookies.Add([Uri]$env:ADD_BASE_URL, $adminCookie)
          $verificationFailed = $false
          try {

            $releases = Invoke-RestMethod `
              -Method Get `
              -Uri "$env:ADD_BASE_URL/api/v1/firmware/releases" `
              -WebSession $session `
              -TimeoutSec 30
            $matchingReleases = @($releases.rows | Where-Object {
              $_.version -eq $env:EXPECTED_VERSION -and
              $_.git_sha -eq $env:EXPECTED_SHA -and
              $_.state -eq 'HIL_ONLY' -and
              ([string]$_.hil_target_mac).ToLowerInvariant() -eq $env:EXPECTED_MAC
            })
            if ($matchingReleases.Count -ne 1) {
              throw 'Exact immutable HIL_ONLY release identity was not found.'
            }

            $campaign = Invoke-RestMethod `
              -Method Get `
              -Uri "$env:ADD_BASE_URL/api/v1/firmware/campaigns/$env:EXPECTED_CAMPAIGN" `
              -WebSession $session `
              -TimeoutSec 30
            if (
              $campaign.campaign_id -ne $env:EXPECTED_CAMPAIGN -or
              $campaign.version -ne $env:EXPECTED_VERSION -or
              $campaign.zone_id -ne $env:EXPECTED_ZONE -or
              $campaign.status -ne 'CANCELLED' -or
              [int]$campaign.eligible -ne 1 -or
              [int]$campaign.legacy_skipped -ne 0 -or
              [int]$campaign.counts.SUCCEEDED -ne 1
            ) {
              throw 'Exact closed production-canary campaign did not contain one successful deployment.'
            }
            if (-not ([string]$campaign.pause_reason).StartsWith('CANARY_ACCEPTED:')) {
              throw 'Canary closure does not carry the explicit CANARY_ACCEPTED audit declaration.'
            }

            $deviceQuery = [Uri]::EscapeDataString($env:EXPECTED_MAC)
            $stable = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $devices = Invoke-RestMethod `
                -Method Get `
                -Uri "$env:ADD_BASE_URL/api/v1/devices?q=$deviceQuery" `
                -WebSession $session `
                -TimeoutSec 30
              $rows = @($devices.rows)
              if ($rows.Count -eq 1) {
                $row = $rows[0]
                $reportedFirmwareVersion = ([string]$row.firmware_version).Trim()
                if ($reportedFirmwareVersion.StartsWith('zone-lite-')) {
                  $reportedFirmwareVersion = $reportedFirmwareVersion.Substring(10)
                }
                $stable = (
                  ([string]$row.hardware_id).ToLowerInvariant() -eq $env:EXPECTED_MAC -and
                  $row.zone_id -eq $env:EXPECTED_ZONE -and
                  $reportedFirmwareVersion -eq $env:EXPECTED_VERSION -and
                  $row.state -eq 'ONLINE' -and
                  [bool]$row.connected -and
                  [bool]$row.ota_capable -and
                  $row.ota_state -eq 'OTA_READY' -and
                  # A freshly recovered live socket reports ONLINE until the
                  # first punch or reconciliation changes the activity label
                  # to LIVE_CAPTURE. Both states are operational; the ZKT,
                  # snapshot, attendance-parity, and Oracle-proof checks below
                  # remain mandatory.
                  @('ONLINE', 'LIVE_CAPTURE') -contains [string]$row.current_activity -and
                  [bool]$row.zkt.online -and
                  $row.zkt.connection_state -eq 'ONLINE' -and
                  $row.zkt.certification_state -eq 'CERTIFIED' -and
                  [bool]$row.zkt.snapshot_complete -and
                  [bool]$row.zkt.capabilities.history_stream_v1 -and
                  [bool]$row.zkt.capabilities.history_range_resume_verified -and
                  [bool]$row.zkt.capabilities.source_tail_v1 -and
                  [int]$row.zkt.attendance_count -ge [int]$env:MINIMUM_TERMINAL_ATTENDANCE
                )
              }
              if ($stable) { break }
              Start-Sleep -Seconds 15
            }
            if (-not $stable) {
              throw 'Production canary did not reach the complete stable live-operation contract.'
            }
            $preflight = Invoke-RestMethod `
              -Method Get `
              -Uri "$env:ADD_BASE_URL/api/v1/devices/$($row.connector_id)/reconciliations/preflight" `
              -WebSession $session `
              -TimeoutSec 30
            $sourceCoverage = $preflight.coverage
            if (
              $null -eq $sourceCoverage -or
              -not [bool]$sourceCoverage.active -or
              -not [bool]$sourceCoverage.source_ledger_complete -or
              -not [bool]$sourceCoverage.terminal_source_parity -or
              -not [bool]$sourceCoverage.chain_continuous -or
              [int]$sourceCoverage.source_committed_cursor -ne [int]$row.zkt.attendance_count -or
              [int]$sourceCoverage.source_ledger_count -ne [int]$sourceCoverage.source_committed_cursor -or
              ([string]$sourceCoverage.source_committed_chain_digest).Length -ne 64
            ) {
              throw 'Canary lacks exact terminal source-cursor parity, one disposition per ordinal, or continuous source-chain evidence.'
            }
            $sourceExceptions = Invoke-RestMethod `
              -Method Get `
              -Uri "$env:ADD_BASE_URL/api/v1/source-exceptions?device_id=$($row.connector_id)&limit=500" `
              -WebSession $session `
              -TimeoutSec 30
            $currentExceptions = @($sourceExceptions.rows | Where-Object {
              [int]$_.terminal_generation -eq [int]$sourceCoverage.terminal_generation
            })
            $unsafeExceptions = @($currentExceptions | Where-Object {
              $_.disposition -notin @('INVALID_TIME', 'MALFORMED') -or
              -not [bool]$_.evidence_available -or
              -not [bool]$_.cursor_advanced -or
              $_.oracle_action -ne 'EXCLUDED_FAIL_CLOSED'
            })
            if ($unsafeExceptions.Count -ne 0) {
              throw 'One or more terminal source exceptions lack immutable evidence, cursor advancement, or fail-closed Oracle exclusion.'
            }
            if ($null -ne $sourceExceptions.next_cursor) {
              throw 'Canary source-exception evidence exceeded one verification page; promotion refuses an incomplete inspection.'
            }
            if ($currentExceptions.Count -lt [int]$env:MINIMUM_SOURCE_EXCEPTIONS) {
              throw 'The known canary poison record is not visible in ADD source exceptions.'
            }
            $campaignStarted = [DateTimeOffset]::Parse([string]$campaign.created_at)
            $logs = Invoke-RestMethod `
              -Method Get `
              -Uri "$env:ADD_BASE_URL/api/v1/devices/$($row.connector_id)/logs?limit=1000" `
              -WebSession $session `
              -TimeoutSec 30
            $canaryLogs = @($logs.rows | Where-Object {
              [DateTimeOffset]::Parse([string]$_.received_at) -ge $campaignStarted
            } | Sort-Object {
              [DateTimeOffset]::Parse([string]$_.received_at)
            })
            $catalogApplied = @($canaryLogs | Where-Object {
              $_.code -eq 'IDENTITY_CATALOG_APPLIED'
            } | Select-Object -Last 1)
            if ($catalogApplied.Count -ne 1) {
              throw 'Canary did not prove that the verified ADD identity catalog was consumed.'
            }
            $catalogAppliedAt = [DateTimeOffset]::Parse(
              [string]$catalogApplied[0].received_at
            )
            $catalogBootId = [string]$catalogApplied[0].boot_id
            $sourceCoverageApplied = @($canaryLogs | Where-Object {
              $_.code -eq 'ADD_SOURCE_COVERAGE_APPLIED' -and
              [string]$_.boot_id -eq $catalogBootId -and
              [Math]::Abs((
                [DateTimeOffset]::Parse([string]$_.received_at) -
                $catalogAppliedAt
              ).TotalSeconds) -le 30
            } | Select-Object -Last 1)
            if ($sourceCoverageApplied.Count -ne 1) {
              throw 'Canary did not consume the identity catalog and authoritative source coverage as one bounded reconnect bootstrap.'
            }
            $tailCommitted = @($canaryLogs | Where-Object {
              $_.code -in @(
                'CURRENT_TAIL_SOURCE_COMMITTED',
                'CURRENT_TAIL_SOURCE_EXCEPTIONS_COMMITTED'
              )
            } | Select-Object -Last 1)
            $sourceProofMode = $null
            $sourceProofCommittedAt = $null
            if ($tailCommitted.Count -eq 1) {
              $sourceProofMode = 'bounded-tail'
              $sourceProofCommittedAt = [DateTimeOffset]::Parse(
                [string]$tailCommitted[0].received_at
              )
            } else {
              # An after-hours canary may have exact certified source parity but
              # receive no legitimate new punch. A newly requested full-source
              # scan is a stronger substitute only when the candidate boot
              # performed it and ADD sealed both immutable source capture and
              # Oracle membership after this exact campaign began.
              $coverageCertified = @($canaryLogs | Where-Object {
                $_.code -eq 'ADD_SOURCE_COVERAGE_CERTIFIED' -and
                [string]$_.boot_id -eq $catalogBootId
              } | Sort-Object {
                [DateTimeOffset]::Parse([string]$_.received_at)
              } | Select-Object -Last 1)
              $completedReconciliations = Invoke-RestMethod `
                -Method Get `
                -Uri (
                  "$env:ADD_BASE_URL/api/v1/reconciliations" +
                  "?connector_id=$($row.connector_id)&status_group=COMPLETED&limit=20"
                ) `
                -WebSession $session `
                -TimeoutSec 30
              $freshFullSourceJobs = @($completedReconciliations.rows | Where-Object {
                $_.status -eq 'COMPLETED' -and
                [int]$_.terminal.generation -eq [int]$sourceCoverage.terminal_generation -and
                [int]$_.checkpoint.next_ordinal -eq [int]$row.zkt.attendance_count -and
                -not [string]::IsNullOrWhiteSpace([string]$_.requested_at) -and
                [DateTimeOffset]::Parse([string]$_.requested_at) -ge $campaignStarted -and
                -not [string]::IsNullOrWhiteSpace([string]$_.capture_certified_at) -and
                -not [string]::IsNullOrWhiteSpace([string]$_.oracle_certified_at) -and
                -not [string]::IsNullOrWhiteSpace([string]$_.completed_at) -and
                $null -ne $_.capture_certificate -and
                $null -ne $_.oracle_certificate
              } | Sort-Object {
                [DateTimeOffset]::Parse([string]$_.requested_at)
              } | Select-Object -Last 1)
              if ($coverageCertified.Count -eq 1 -and $freshFullSourceJobs.Count -eq 1) {
                $coverageCertifiedAt = [DateTimeOffset]::Parse(
                  [string]$coverageCertified[0].received_at
                )
                $freshFullSourceJob = $freshFullSourceJobs[0]
                $freshRequestedAt = [DateTimeOffset]::Parse(
                  [string]$freshFullSourceJob.requested_at
                )
                $freshCaptureCertifiedAt = [DateTimeOffset]::Parse(
                  [string]$freshFullSourceJob.capture_certified_at
                )
                $freshOracleCertifiedAt = [DateTimeOffset]::Parse(
                  [string]$freshFullSourceJob.oracle_certified_at
                )
                $freshCompletedAt = [DateTimeOffset]::Parse(
                  [string]$freshFullSourceJob.completed_at
                )
                $coverageCapturedAt = [DateTimeOffset]::Parse(
                  [string]$sourceCoverage.captured_at
                )
                $coverageOracleCertifiedAt = [DateTimeOffset]::Parse(
                  [string]$sourceCoverage.oracle_certified_at
                )
                $freshFullSourceProof = (
                  $coverageCertifiedAt -ge $freshRequestedAt -and
                  $freshCaptureCertifiedAt -ge $freshRequestedAt -and
                  $freshOracleCertifiedAt -ge $freshCaptureCertifiedAt -and
                  $freshCompletedAt -ge $freshOracleCertifiedAt -and
                  $sourceCoverage.capture_state -in @(
                    'SOURCE_CAPTURE_CERTIFIED',
                    'SOURCE_CAPTURE_CERTIFIED_WITH_EXCEPTIONS'
                  ) -and
                  $sourceCoverage.oracle_state -eq 'ORACLE_MEMBERSHIP_CERTIFIED' -and
                  $null -ne $sourceCoverage.capture_evidence -and
                  $null -ne $sourceCoverage.oracle_evidence -and
                  $coverageCapturedAt -eq $freshCaptureCertifiedAt -and
                  $coverageOracleCertifiedAt -eq $freshOracleCertifiedAt
                )
                if ($freshFullSourceProof) {
                  $sourceProofMode = 'fresh-full-source'
                  $sourceProofCommittedAt = $coverageCertifiedAt
                }
              }
            }
            if ($null -eq $sourceProofCommittedAt) {
              throw 'Canary proved neither a poison-safe bounded tail nor a fresh full-source and Oracle certificate from the accepted candidate boot.'
            }
            $laterFailures = @($canaryLogs | Where-Object {
              $_.code -in @(
                'TRUTH_IDENTITY_INCOMPLETE',
                'FULL_RECONCILE_FAILED',
                'SOURCE_RANGE_PREPARE_FAILED',
                'SOURCE_RANGE_LAYOUT_INVALID',
                'SOURCE_RANGE_COUNT_REGRESSION',
                'SOURCE_FIRST_ANCHOR_DIVERGED',
                'SOURCE_COMMITTED_BOUNDARY_DIVERGED',
                'ADD_SOURCE_COVERAGE_INVALIDATED',
                'SOURCE_TAIL_REPLAY_DIVERGED',
                'SOURCE_TAIL_COUNT_REGRESSION',
                'SOURCE_TAIL_CURSOR_DIVERGED',
                'SOURCE_TAIL_CHAIN_DIVERGED',
                'CURRENT_TAIL_CHECKPOINT_RETRY'
              ) -and
              [DateTimeOffset]::Parse([string]$_.received_at) -gt $sourceProofCommittedAt
            })
            if ($laterFailures.Count -ne 0) {
              throw 'Canary emitted a fail-closed truth error after delegating its Oracle pass.'
            }

            $attendanceCount = 0
            $unsafeDeliveryCount = 0
            $blockedIdentityCount = 0
            $quarantinedIdentityReuseCount = 0
            $quarantinedInvalidDeviceTimeCount = 0
            $cursor = $null
            $seenCursors = @{}
            do {
              $attendanceUri = "$env:ADD_BASE_URL/api/v1/attendance?device_id=$($row.connector_id)&limit=500"
              if ($null -ne $cursor) {
                $attendanceUri += "&cursor=$cursor"
              }
              $attendance = Invoke-RestMethod `
                -Method Get `
                -Uri $attendanceUri `
                -WebSession $session `
                -TimeoutSec 30
              $pageRows = @($attendance.rows)
              $attendanceCount += $pageRows.Count
              foreach ($attendanceRow in $pageRows) {
                $deliveryState = [string]$attendanceRow.ords_status
                if ($deliveryState -eq 'BLOCKED_IDENTITY') {
                  $blockedIdentityCount++
                  continue
                }
                if ($deliveryState -eq 'QUARANTINED_IDENTITY_REUSE') {
                  $quarantinedIdentityReuseCount++
                  continue
                }
                if ($deliveryState -eq 'QUARANTINED_INVALID_DEVICE_TIME') {
                  $quarantinedInvalidDeviceTimeCount++
                  continue
                }
                if (
                  [string]::IsNullOrWhiteSpace(
                    [string]$attendanceRow.oracle_confirmed_at
                  ) -or
                  $deliveryState -notin @('ACKED', 'ACKED_CHECK')
                ) {
                  $unsafeDeliveryCount++
                }
              }
              $nextCursor = $attendance.next_cursor
              if ($null -ne $nextCursor) {
                $cursorKey = [string]$nextCursor
                if ($seenCursors.ContainsKey($cursorKey)) {
                  throw 'ADD attendance pagination repeated a cursor during canary verification.'
                }
                $seenCursors[$cursorKey] = $true
              }
              $cursor = $nextCursor
            } while ($null -ne $cursor)
            if ($unsafeDeliveryCount -ne 0) {
              throw "ADD still has $unsafeDeliveryCount canary attendance row(s) in an unsafe or retryable Oracle delivery state."
            }
            Write-Host (
              'Exact production canary is stable and source-cursor parity is exact; ' +
              "all resolvable rows are Oracle-confirmed. Preserved fail-closed rows: " +
              "blocked_identity=$blockedIdentityCount " +
              "quarantined_identity_reuse=$quarantinedIdentityReuseCount " +
              "quarantined_invalid_device_time=$quarantinedInvalidDeviceTimeCount " +
              "source_exceptions=$($currentExceptions.Count) " +
              "source_proof=$sourceProofMode."
            )
          } catch {
            $verificationFailed = $true
            throw
          } finally {
            try {
              $logoutHeaders = @{
                'X-CSRF-Token' = [string]$login.csrf_token
              }
              Invoke-RestMethod `
                -Method Post `
                -Uri "$env:ADD_BASE_URL/api/v1/auth/logout" `
                -Headers $logoutHeaders `
                -WebSession $session `
                -ContentType 'application/json' `
                -Body '{}' `
                -TimeoutSec 15 | Out-Null
            } catch {
              if (-not $verificationFailed) {
                throw 'Production canary verification succeeded, but the temporary ADD session could not be revoked.'
              }
              Write-Warning 'Temporary ADD session revocation also failed after a verification failure.'
            }
          }

  promote-add:
    needs: [provenance, verify-production-canary]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Promote the exact canary-tested bytes
        shell: powershell
        env:
          ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
        run: |
          if (-not $env:ADD_FIRMWARE_STORE_HOST_PATH) { throw "ADD_FIRMWARE_STORE_HOST_PATH is not configured" }
          ./deploy/add/promote-firmware.ps1 `
            -StoreDirectory $env:ADD_FIRMWARE_STORE_HOST_PATH `
            -Version "${{ inputs.version }}" `
            -GitSha "${{ needs.provenance.outputs.sha }}" `
            -OutputDirectory promoted-release
          if (Test-Path -LiteralPath 'promoted-release/.hil-only.json') {
            throw 'Promoted production package is still HIL-targeted.'
          }
