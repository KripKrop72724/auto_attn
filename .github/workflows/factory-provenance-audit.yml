name: Read-only exact factory bundle provenance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: choice
        options: [AUDIT EXACT PUBLISHED 2.5.2 BUNDLE]
        required: true
permissions:
  contents: read
concurrency:
  group: exact-factory-provenance-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT EXACT PUBLISHED 2.5.2 BUNDLE'
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact retained bundle without firmware export
        timeout-minutes: 3
        shell: powershell
        run: |
          # A reused Windows checkout can keep clean CRLF bytes when only
          # .gitattributes changed. Recreate this one trusted tracked file;
          # checkout-index --force alone may retain its cached working bytes.
          $head = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'AUDIT_CHECKOUT_IDENTITY_CHANGED' }
          git diff --cached --quiet -- scripts/audit_factory_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_CHECKOUT_INDEX_CHANGED' }
          git diff --quiet -- scripts/audit_factory_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_CHECKOUT_WORKTREE_CHANGED' }
          Remove-Item -LiteralPath scripts/audit_factory_bundle.py -Force
          git checkout-index --force -- scripts/audit_factory_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_CHECKOUT_REFRESH_FAILED' }
          # Docker uses a bounded shell=False launcher; native stderr is never
          # emitted or redirected through Windows PowerShell 5.1.
          python scripts/invoke_factory_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'EXACT_FACTORY_ARCHIVE_AUDIT_REFUSED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-factory-provenance-metadata
          path: factory-provenance-report-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
