name: Quetta read-only ZKT protocol diagnostic

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact green main commit containing the diagnostic
        required: true
        type: string
      quetta_device_mac:
        description: Exact Quetta Zone Lite ESP MAC (not the ZKT MAC)
        required: true
        type: string
      confirmation:
        description: Type QUETTA READ ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zone-lite-quetta-diagnostic
  cancel-in-progress: false

env:
  DIAGNOSTIC_VERSION: 2.5.3

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      mac: ${{ steps.provenance.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: provenance
        name: Require exact main SHA and explicit Quetta read-only scope
        shell: bash
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_QUETTA_DEVICE_MAC: ${{ inputs.quetta_device_mac }}
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = 'QUETTA READ ONLY'
          mac="$(tr '[:upper:]' '[:lower:]' <<<"$INPUT_QUETTA_DEVICE_MAC")"
          [[ "$mac" =~ ^([0-9a-f]{2}:){5}[0-9a-f]{2}$ ]]
          git fetch origin main
          sha="$(git rev-parse "${INPUT_COMMIT_SHA}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  build:
    needs: provenance
    runs-on: ubuntu-latest
    environment: firmware-signing
    env:
      ZONE_LITE_SETUP_PASSWORD: ${{ secrets.ZONE_LITE_SETUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the firmware contract runner
        run: python -m pip install "pytest>=8.2"
      - name: Run diagnostic and rollout contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/firmware/test_zone_lite_comm_key_contract.py \
            tests/firmware/test_zone_lite_quetta_diagnostic_contract.py \
            tests/firmware/test_zone_lite_ota_contract.py
          python3 tests/firmware/test_identity_catalog_rollout_preflight.py
          python3 tests/firmware/test_oracle_reconcile_load_preflight.py
      - name: Build the read-only Quetta diagnostic
        working-directory: firmware/zone_lite
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZONE_LITE_SETUP_PASSWORD"
          test "$(sed -n 's/^project(zone_lite VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)" = '2.5.2'
          docker run --rm \
            -e ZONE_LITE_SETUP_PASSWORD \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/firmware/zone_lite \
            espressif/idf:v5.5.3 \
            bash -lc 'rm -rf build-quetta-diagnostic && idf.py -B build-quetta-diagnostic -D SDKCONFIG=/tmp/zone-lite-quetta-diagnostic-sdkconfig -D PROJECT_VER=2.5.3 -D ZONE_LITE_QUETTA_DIAGNOSTIC=1 build && python -c "import json; description=json.load(open(\"build-quetta-diagnostic/project_description.json\", encoding=\"utf-8\")); assert description.get(\"project_version\") == \"2.5.3\", \"Quetta diagnostic application version mismatch\""'
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-quetta-diagnostic-unsigned-${{ needs.provenance.outputs.sha }}
          path: firmware/zone_lite/build-quetta-diagnostic/zone_lite.bin
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [provenance, build]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-signing
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-quetta-diagnostic-unsigned-${{ needs.provenance.outputs.sha }}
          path: unsigned
      - name: Sign and permanently mark as non-promotable diagnostic bytes
        run: |
          $ErrorActionPreference = 'Stop'
          $vault = Join-Path $env:ProgramData 'StateLife\AttendanceDeviceDashboard\firmware-signing'
          ./deploy/add/sign-firmware-release.ps1 `
            -VaultDirectory $vault `
            -UnsignedDirectory unsigned `
            -OutputDirectory release `
            -Version $env:DIAGNOSTIC_VERSION `
            -GitSha '${{ needs.provenance.outputs.sha }}'
          $manifest = Get-Content -LiteralPath 'release/manifest.json' -Raw | ConvertFrom-Json
          $marker = [ordered]@{
            schema_version = 1
            profile = 'QUETTA_ZKT_PROTOCOL_READ_ONLY'
            target_zone_id = 'ZONE-QUETTA-01'
            promotable = $false
            configuration_commit_allowed = $false
            git_sha = '${{ needs.provenance.outputs.sha }}'
            image_sha256 = [string]$manifest.image_sha256
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release/.diagnostic-only.json'),
            $marker + "`n",
            (New-Object Text.UTF8Encoding($false))
          )
      - uses: actions/upload-artifact@v4
        with:
          name: zone-lite-${{ env.DIAGNOSTIC_VERSION }}-quetta-diagnostic-only
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-quetta-only:
    needs: [provenance, sign]
    runs-on: [self-hosted, Windows, X64]
    environment: firmware-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zone-lite-${{ env.DIAGNOSTIC_VERSION }}-quetta-diagnostic-only
          path: firmware-release
      - name: Publish behind exact-MAC HIL quarantine
        shell: powershell
        env:
          ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
        run: |
          if (-not $env:ADD_FIRMWARE_STORE_HOST_PATH) { throw 'ADD_FIRMWARE_STORE_HOST_PATH is not configured' }
          if (-not (Test-Path -LiteralPath 'firmware-release/.diagnostic-only.json' -PathType Leaf)) {
            throw 'Non-promotable diagnostic marker is missing'
          }
          ./deploy/add/publish-firmware.ps1 `
            -SourceDirectory firmware-release `
            -StoreDirectory $env:ADD_FIRMWARE_STORE_HOST_PATH `
            -Version $env:DIAGNOSTIC_VERSION `
            -PublicationMode HIL_ONLY `
            -HilTargetMac '${{ needs.provenance.outputs.mac }}'
