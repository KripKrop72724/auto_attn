name: Deploy ADD

on:
  workflow_run:
    workflows: ["ADD CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact tested commit SHA to deploy (defaults to the current main SHA)
        required: false
        type: string
      recover_core:
        description: Start the existing API and UI containers without rebuilding or changing data
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: add-production
  cancel-in-progress: false

jobs:
  recover-core:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_core == true
    runs-on: [self-hosted, Windows, X64]
    environment: add-production
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Start the existing core containers and verify local service
        run: |
          $ErrorActionPreference = 'Stop'
          $core = @(
            'attendance-device-dashboard-postgres-1',
            'attendance-device-dashboard-redis-1',
            'attendance-device-dashboard-add-api-1'
          )
          $known = @(& docker ps -a --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0) {
            throw 'Docker is unavailable on the ADD production runner.'
          }
          foreach ($name in $core) {
            if ($known -notcontains $name) {
              throw "Required ADD container is missing: $name"
            }
            & docker start $name
            if ($LASTEXITCODE -ne 0) {
              throw "Could not start required ADD container: $name"
            }
          }

          function Wait-HealthyEndpoint {
            param([Parameter(Mandatory = $true)][string] $Uri)
            foreach ($attempt in 1..30) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $Uri -TimeoutSec 3
                if ($response.StatusCode -eq 200) { return }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            throw "ADD recovery endpoint did not become healthy: $Uri"
          }

          Wait-HealthyEndpoint -Uri 'http://127.0.0.1:8096/health/live'
          $web = 'attendance-device-dashboard-add-web-1'
          if ($known -notcontains $web) {
            throw "Required ADD container is missing: $web"
          }
          & docker start $web
          if ($LASTEXITCODE -ne 0) {
            throw "Could not start required ADD container: $web"
          }
          Wait-HealthyEndpoint -Uri 'http://127.0.0.1:8095/health/ui'
          Write-Host 'Existing ADD API and UI containers are serving locally.'

  announce:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.recover_core != true) ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark the exact production commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state pending \
            --arg context 'ADD production deployment' \
            --arg description 'Waiting for the production Windows runner' \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" \
            --data "$payload"

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.recover_core != true) ||
      github.event.workflow_run.conclusion == 'success'
    needs: announce
    runs-on: [self-hosted, Windows, X64]
    environment: add-production
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || github.sha }}
      ADD_DEPLOY_FLEET_ROOT_SECRET: ${{ secrets.ADD_FLEET_ROOT_SECRET }}
      ADD_DEPLOY_ADMIN_PASSWORD_HASH: ${{ secrets.ADD_ADMIN_PASSWORD_HASH }}
      ADD_DEPLOY_ORDS_USERNAME: ${{ secrets.ADD_ORDS_USERNAME }}
      ADD_DEPLOY_ORDS_PASSWORD: ${{ secrets.ADD_ORDS_PASSWORD }}
      ADD_DEPLOY_ATTENDANCE_REPAIR_ORDS_USERNAME: ${{ secrets.ADD_ATTENDANCE_REPAIR_ORDS_USERNAME }}
      ADD_DEPLOY_ATTENDANCE_REPAIR_ORDS_PASSWORD: ${{ secrets.ADD_ATTENDANCE_REPAIR_ORDS_PASSWORD }}
      ADD_DEPLOY_FIRMWARE_OTA_ENABLED: ${{ vars.ADD_FIRMWARE_OTA_ENABLED }}
      ADD_DEPLOY_FIRMWARE_HIL_ENABLED: ${{ vars.ADD_FIRMWARE_HIL_ENABLED }}
      ADD_DEPLOY_FIRMWARE_HIL_TARGET_MAC: ${{ vars.ADD_FIRMWARE_HIL_TARGET_MAC }}
      ADD_DEPLOY_COMM_KEY_MANAGEMENT_ENABLED: ${{ vars.ADD_COMM_KEY_MANAGEMENT_ENABLED }}
      ADD_DEPLOY_COMM_KEY_REVEAL_ENABLED: ${{ vars.ADD_COMM_KEY_REVEAL_ENABLED }}
      ADD_DEPLOY_COMM_KEY_SECRET_FERNET_KEY: ${{ secrets.ADD_COMM_KEY_SECRET_FERNET_KEY }}
      ADD_DEPLOY_RECONCILIATION_ENABLED: ${{ vars.ADD_RECONCILIATION_ENABLED }}
      ADD_DEPLOY_RECONCILIATION_SELF_HEALING_ENABLED: ${{ vars.ADD_RECONCILIATION_SELF_HEALING_ENABLED }}
      ADD_DEPLOY_RECONCILIATION_DEVICE_CONCURRENCY: ${{ vars.ADD_RECONCILIATION_DEVICE_CONCURRENCY }}
      ADD_DEPLOY_ATTENDANCE_REPAIR_PREVIEW_ENABLED: ${{ vars.ADD_ATTENDANCE_REPAIR_PREVIEW_ENABLED }}
      ADD_DEPLOY_ATTENDANCE_REPAIR_EXECUTION_ENABLED: ${{ vars.ADD_ATTENDANCE_REPAIR_EXECUTION_ENABLED }}
      ADD_DEPLOY_PROVISIONING_ENABLED: ${{ vars.ADD_PROVISIONING_ENABLED }}
      ADD_DEPLOY_PROVISIONING_PAIRING_SECRET: ${{ secrets.ADD_PROVISIONING_PAIRING_SECRET }}
      ADD_DEPLOY_PROVISIONING_INTERNAL_TOKEN: ${{ secrets.ADD_PROVISIONING_INTERNAL_TOKEN }}
      ADD_DEPLOY_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64: ${{ vars.ADD_PROVISIONING_COMPANION_RELEASE_PUBLIC_KEY_B64 }}
      ADD_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FIRMWARE_STORE_HOST_PATH }}
      ADD_FACTORY_FIRMWARE_STORE_HOST_PATH: ${{ vars.ADD_FACTORY_FIRMWARE_STORE_HOST_PATH }}
      ADD_COMPANION_RELEASE_STORE_HOST_PATH: ${{ vars.ADD_COMPANION_RELEASE_STORE_HOST_PATH }}
      ADD_DEPLOY_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ vars.ADD_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout is the tested commit
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:DEPLOY_SHA) {
            throw "Checkout mismatch: expected $env:DEPLOY_SHA, got $actual"
          }

      - name: Load deployment secrets without logging values
        env:
          CONFIGURED_ENV_FILE: ${{ vars.ADD_ENV_FILE }}
          CONFIGURED_ENV_CONTENT: ${{ secrets.ADD_ENV_FILE_CONTENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $programDataFile = Join-Path $env:ProgramData 'StateLife\AttendanceDeviceDashboard\config\add.env'
          $homeFile = Join-Path $HOME '.config\auto-attn\add.env'
          $sourceFile = $null
          foreach ($candidate in @($env:CONFIGURED_ENV_FILE, $programDataFile, $homeFile)) {
            if ($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              $sourceFile = $candidate
              break
            }
          }
          if ($sourceFile) {
            Copy-Item -LiteralPath $sourceFile -Destination '.env.add' -Force
          } elseif ($env:CONFIGURED_ENV_CONTENT) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::WriteAllText((Join-Path $PWD '.env.add'), $env:CONFIGURED_ENV_CONTENT, $utf8NoBom)
          } else {
            throw 'Configure ADD_ENV_FILE, the protected ProgramData file, or ADD_ENV_FILE_CONTENT.'
          }
          if (-not $env:ADD_DEPLOY_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64) {
            throw 'Configure ADD_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64 in the add-production environment.'
          }
          Add-Content -LiteralPath '.env.add' -Value "ADD_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64='$env:ADD_DEPLOY_FIRMWARE_SIGNING_PUBLIC_KEY_PEM_B64'"

      - name: Transactionally deploy ports 8095 and 8096
        run: .\deploy\add\deploy.ps1 -ExpectedSha $env:DEPLOY_SHA

      - name: Record credential-free Oracle egress diagnostics
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'https://eclaim2.slichealth.com/ords/slic_hrm/raw_attn_capture_event/raw-captures'
          $targetUri = [Uri]$target
          $internalTarget = 'https://local.slichealth.com/ords/slic_hrm/raw_attn_capture_event/raw-captures'
          $internalTargetUri = [Uri]$internalTarget
          $proxyUri = [System.Net.WebRequest]::DefaultWebProxy.GetProxy($targetUri)
          $defaultProxyUsed = $proxyUri -and $proxyUri.AbsoluteUri -ne $targetUri.AbsoluteUri
          $proxyEnvironmentPresent = -not [string]::IsNullOrWhiteSpace($env:HTTPS_PROXY) -or `
            -not [string]::IsNullOrWhiteSpace($env:HTTP_PROXY)

          $dnsResult = 'ERROR_UNKNOWN'
          $dnsAddresses = @()
          try {
            $addresses = [System.Net.Dns]::GetHostAddresses($targetUri.Host)
            $dnsAddresses = @($addresses | ForEach-Object { $_.IPAddressToString })
            $dnsResult = if ($dnsAddresses.Count -gt 0) { 'OK' } else { 'ERROR_NO_ADDRESSES' }
          } catch {
            $dnsResult = "ERROR_$($_.Exception.GetType().Name)"
          }

          $internalDnsResult = 'ERROR_UNKNOWN'
          $internalDnsAddresses = @()
          try {
            $internalAddresses = [System.Net.Dns]::GetHostAddresses($internalTargetUri.Host)
            $internalDnsAddresses = @(
              $internalAddresses | ForEach-Object { $_.IPAddressToString }
            )
            $internalDnsResult = if ($internalDnsAddresses.Count -gt 0) {
              'OK'
            } else {
              'ERROR_NO_ADDRESSES'
            }
          } catch {
            $internalDnsResult = "ERROR_$($_.Exception.GetType().Name)"
          }

          $routeResult = 'ERROR_NO_DNS_TARGET'
          if ($dnsAddresses.Count -gt 0) {
            try {
              $routes = @(Find-NetRoute `
                -RemoteIPAddress $dnsAddresses[0] `
                -ErrorAction Stop)
              $routeResult = if ($routes.Count -gt 0) { 'OK' } else { 'ERROR_NO_ROUTE' }
            } catch {
              $routeResult = "ERROR_$($_.Exception.GetType().Name)"
            }
          }

          $firewallProfileResult = 'ERROR_UNKNOWN'
          $outboundBlockRuleCount = -1
          $targetBlockCandidateCount = -1
          try {
            $profileTokens = @(
              Get-NetFirewallProfile -ErrorAction Stop |
                ForEach-Object { "$($_.Name):$($_.DefaultOutboundAction)" }
            )
            $firewallProfileResult = $profileTokens -join ','
            $outboundBlockRules = @(
              Get-NetFirewallRule `
                -PolicyStore ActiveStore `
                -Direction Outbound `
                -Enabled True `
                -Action Block `
                -ErrorAction Stop
            )
            $outboundBlockRuleCount = $outboundBlockRules.Count
            $targetBlockCandidateCount = 0
            if ($dnsAddresses.Count -gt 0) {
              foreach ($rule in $outboundBlockRules) {
                $addressFilters = @($rule | Get-NetFirewallAddressFilter -ErrorAction Stop)
                $portFilters = @($rule | Get-NetFirewallPortFilter -ErrorAction Stop)
                $addressMatches = @(
                  $addressFilters | Where-Object {
                    $_.RemoteAddress -contains 'Any' -or
                    $_.RemoteAddress -contains $dnsAddresses[0]
                  }
                ).Count -gt 0
                $portMatches = @(
                  $portFilters | Where-Object {
                    ($_.Protocol -eq 'Any' -or $_.Protocol -eq 'TCP' -or $_.Protocol -eq 6) -and
                    ($_.RemotePort -contains 'Any' -or $_.RemotePort -contains '443')
                  }
                ).Count -gt 0
                if ($addressMatches -and $portMatches) {
                  $targetBlockCandidateCount += 1
                }
              }
            }
          } catch {
            $firewallProfileResult = "ERROR_$($_.Exception.GetType().Name)"
          }

          $egressResult = 'ERROR_UNKNOWN'
          foreach ($probeUrl in @('https://api.ipify.org', 'https://checkip.amazonaws.com')) {
            try {
              $egressResponse = Invoke-WebRequest `
                -UseBasicParsing `
                -Method Get `
                -Uri $probeUrl `
                -TimeoutSec 12
              $candidateAddress = ([string]$egressResponse.Content).Trim()
              $parsedAddress = $null
              if ([System.Net.IPAddress]::TryParse($candidateAddress, [ref]$parsedAddress)) {
                $egressResult = "OK_$candidateAddress"
                break
              }
              $egressResult = 'ERROR_INVALID_RESPONSE'
            } catch {
              $egressResult = "ERROR_$($_.Exception.GetType().Name)"
            }
          }

          $tcpResult = 'ERROR_UNKNOWN'
          $tcpClient = New-Object System.Net.Sockets.TcpClient
          try {
            $connectTask = $tcpClient.ConnectAsync($targetUri.Host, 443)
            if (-not $connectTask.Wait(12000)) {
              $tcpResult = 'ERROR_TIMEOUT'
            } elseif ($connectTask.IsFaulted) {
              $tcpResult = 'ERROR_CONNECT_FAILED'
            } else {
              $tcpResult = 'OK'
            }
          } catch {
            $tcpResult = "ERROR_$($_.Exception.GetType().Name)"
          } finally {
            $tcpClient.Dispose()
          }

          function Invoke-BoundedOptionsProbe {
            param([Parameter(Mandatory = $true)][string]$Uri)
            try {
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
              $response = Invoke-WebRequest `
                -UseBasicParsing `
                -Method Options `
                -Uri $Uri `
                -TimeoutSec 12
              return "HTTP_$($response.StatusCode)"
            } catch {
              $exception = $_.Exception
              if ($exception.Response -and $exception.Response.StatusCode) {
                return "HTTP_$([int]$exception.Response.StatusCode)"
              }
              if ($exception -is [System.Net.WebException]) {
                return "ERROR_WEB_$($exception.Status.ToString().ToUpperInvariant())"
              }
              return "ERROR_$($exception.GetType().Name)"
            }
          }
          $hostResult = Invoke-BoundedOptionsProbe -Uri $target
          $internalHostResult = Invoke-BoundedOptionsProbe -Uri $internalTarget

          $probe = @'
          import urllib.error
          import urllib.request

          targets = {
              "PUBLIC": "https://eclaim2.slichealth.com/ords/slic_hrm/raw_attn_capture_event/raw-captures",
              "INTERNAL": "https://local.slichealth.com/ords/slic_hrm/raw_attn_capture_event/raw-captures",
          }
          for label, target in targets.items():
              request = urllib.request.Request(target, method="OPTIONS")
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      print(f"{label}_HTTP_{response.status}")
              except urllib.error.HTTPError as exc:
                  print(f"{label}_HTTP_{exc.code}")
              except Exception as exc:
                  reason = exc.reason if isinstance(exc, urllib.error.URLError) else exc
                  print(f"{label}_ERROR_{type(reason).__name__}")
          '@
          # Windows PowerShell 5.1 can split or requote multiline native-command
          # arguments. Encode the script so python -c receives one deterministic
          # ASCII argument without exposing credentials or response data.
          $probeEncoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($probe))
          $probeLauncher = "import base64;exec(base64.b64decode('$probeEncoded'))"
          $arguments = @(
            'compose', '--env-file', '.env.add', '-f', 'docker-compose.add.yml',
            'exec', '-T', 'add-api', 'python', '-c', $probeLauncher
          )
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $containerOutput = & docker @arguments 2>&1
            $containerExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          $containerResults = @{
            PUBLIC = 'ERROR_UNEXPECTED_PROBE_OUTPUT'
            INTERNAL = 'ERROR_UNEXPECTED_PROBE_OUTPUT'
          }
          foreach ($line in $containerOutput) {
            $match = [regex]::Match(
              "$line",
              '(?<![A-Za-z0-9_])(PUBLIC|INTERNAL)_(HTTP_[0-9]{3}|ERROR_[A-Za-z0-9_]+)(?![A-Za-z0-9_])'
            )
            if ($match.Success) {
              $containerResults[$match.Groups[1].Value] = $match.Groups[2].Value
            }
          }
          $containerResult = $containerResults.PUBLIC
          $internalContainerResult = $containerResults.INTERNAL

          Write-Host "ORDS DNS probe=$dnsResult"
          Write-Host "ORDS resolved addresses=$($dnsAddresses -join ',')"
          Write-Host "ORDS internal DNS probe=$internalDnsResult"
          Write-Host "ORDS internal resolved address count=$($internalDnsAddresses.Count)"
          Write-Host "ORDS selected route=$routeResult"
          Write-Host "ORDS TCP 443 probe=$tcpResult"
          Write-Host "ORDS host probe=$hostResult"
          Write-Host "ORDS container probe=$containerResult"
          Write-Host "ORDS internal host probe=$internalHostResult"
          Write-Host "ORDS internal container probe=$internalContainerResult"
          Write-Host "ORDS container command completed=$($containerExit -eq 0)"
          Write-Host "Runner public egress address=$egressResult"
          Write-Host "Runner default proxy used=$defaultProxyUsed"
          Write-Host "Runner proxy environment present=$proxyEnvironmentPresent"
          Write-Host "Windows firewall outbound defaults=$firewallProfileResult"
          Write-Host "Windows enabled outbound block rule count=$outboundBlockRuleCount"
          Write-Host "Windows ORDS block candidate count=$targetBlockCandidateCount"
          if ($hostResult -ne 'HTTP_200' -or $containerExit -ne 0 -or $containerResult -ne 'HTTP_200') {
            Write-Warning 'ORDS egress is degraded; attendance remains preserved in the bounded retry queue.'
          }
          if ($internalHostResult -eq 'HTTP_200' -and $internalContainerResult -eq 'HTTP_200') {
            Write-Warning 'The internal ORDS hostname is reachable from ADD and is a validated route candidate.'
          }
          # A connectivity observation is operational evidence, not a release failure. The
          # outbox is durable and the dashboard carries the degraded-route alert.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Show bounded container state on failure
        if: failure()
        run: |
          if (Test-Path -LiteralPath '.env.add') {
            # deploy.ps1 already emits the only bounded, secret-redacted log
            # sample before rollback. Never bypass that sanitizer here.
            docker compose --env-file .env.add -f docker-compose.add.yml ps -a
          }

      - name: Remove workspace secret copy
        if: always()
        run: Remove-Item -LiteralPath '.env.add' -Force -ErrorAction SilentlyContinue

  verify-public:
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify API and UI through a Pakistan public-network probe
        run: |
          set -euo pipefail

          verify_from_pakistan() {
            local host="$1"
            local path="$2"
            local marker="$3"
            local payload response measurement_id result state

            payload="$(jq -nc \
              --arg target "$host" \
              --arg path "$path" \
              '{
                target: $target,
                type: "http",
                locations: [{country: "PK"}],
                limit: 1,
                measurementOptions: {
                  protocol: "HTTPS",
                  request: {method: "GET", path: $path}
                }
              }')"

            for _ in 1 2 3; do
              if response="$(curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --header 'Content-Type: application/json' \
                --data "$payload" \
                https://api.globalping.io/v1/measurements)" && \
                measurement_id="$(jq -er '.id' <<<"$response")"; then
                break
              fi
              measurement_id=''
              sleep 5
            done

            if [ -z "$measurement_id" ]; then
              echo "Unable to schedule the public-network verification for $host." >&2
              return 1
            fi

            for _ in $(seq 1 20); do
              sleep 3
              result="$(curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                "https://api.globalping.io/v1/measurements/$measurement_id")"
              state="$(jq -r '.status' <<<"$result")"
              if [ "$state" = 'in-progress' ]; then
                continue
              fi
              if [ "$state" != 'finished' ]; then
                echo "Public-network verification ended in state $state for $host." >&2
                return 1
              fi
              if ! jq -e --arg marker "$marker" '
                (.results | length) > 0 and
                all(.results[];
                  .probe.country == "PK" and
                  .result.statusCode == 200 and
                  ((.result.rawBody // "") | contains($marker))
                )
              ' <<<"$result" >/dev/null; then
                echo "Pakistan public-network verification failed for $host$path." >&2
                jq -r '.results[] |
                  "probe=\(.probe.country)/\(.probe.city) status=\(.result.statusCode // "none")"' \
                  <<<"$result" >&2
                return 1
              fi
              jq -r '.results[] |
                "Verified \(.probe.country)/\(.probe.city) -> status \(.result.statusCode)"' \
                <<<"$result"
              return 0
            done

            echo "Pakistan public-network verification timed out for $host." >&2
            return 1
          }

          verify_from_pakistan \
            'autoattn.slichealth.com' \
            '/health/ready' \
            '"database":true'
          verify_from_pakistan \
            'attendancedevices.slichealth.com' \
            '/' \
            'Attendance Device Dashboard'

  report:
    if: always() && needs.announce.result == 'success'
    needs: [announce, deploy, verify-public]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish production deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-public.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" = success ] && [ "$VERIFY_RESULT" = success ]; then
            state=success
            description='ADD origin and both public domains are healthy from Pakistan'
          else
            state=failure
            description="Deployment=$DEPLOY_RESULT public-verification=$VERIFY_RESULT"
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ADD production deployment' \
            --arg description "$description" \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" \
            --data "$payload"
