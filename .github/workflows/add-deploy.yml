name: Deploy ADD

on:
  workflow_run:
    workflows: ["ADD CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: add-production
  cancel-in-progress: false

jobs:
  announce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark production deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state pending \
            --arg context 'ADD production deployment' \
            --arg description 'Waiting for the self-hosted production runner' \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" \
            --data "$payload"

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    needs: announce
    # WIN-80SOHNEH66P is the repository's production server runner.
    runs-on: [self-hosted, Windows, X64]
    environment: add-production
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Load deployment secrets
        env:
          CONFIGURED_ENV_FILE: ${{ vars.ADD_ENV_FILE }}
          CONFIGURED_ENV_CONTENT: ${{ secrets.ADD_ENV_FILE_CONTENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONFIGURED_ENV_FILE) {
            $sourceFile = $env:CONFIGURED_ENV_FILE
          } elseif (Test-Path -LiteralPath (Join-Path $HOME '.config\auto-attn\add.env') -PathType Leaf) {
            $sourceFile = Join-Path $HOME '.config\auto-attn\add.env'
          } else {
            $sourceFile = $null
          }
          if ($sourceFile) {
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
              throw "Protected ADD environment file is missing: $sourceFile"
            }
            Copy-Item -LiteralPath $sourceFile -Destination '.env.add' -Force
          } elseif ($env:CONFIGURED_ENV_CONTENT) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText((Join-Path $PWD '.env.add'), $env:CONFIGURED_ENV_CONTENT, $utf8NoBom)
          } else {
            throw 'Neither ADD_ENV_FILE nor ADD_ENV_FILE_CONTENT is configured.'
          }

      - name: Deploy ports 8095 and 8096
        run: .\deploy\add\deploy.ps1

      - name: Verify ADD services
        run: |
          $ErrorActionPreference = 'Stop'
          & curl.exe --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8096/health/ready
          if ($LASTEXITCODE -ne 0) { throw 'ADD backend readiness check failed' }
          & curl.exe --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8095/health/live
          if ($LASTEXITCODE -ne 0) { throw 'ADD frontend liveness check failed' }

      - name: Show diagnostics on failure
        if: failure()
        run: |
          if (Test-Path -LiteralPath '.env.add') {
            docker compose --env-file .env.add -f docker-compose.add.yml logs --tail=250
          } else {
            Write-Host 'No workspace environment file was created; deployment stopped before Compose.'
          }

      - name: Remove workspace secret copy
        if: always()
        run: Remove-Item -LiteralPath '.env.add' -Force -ErrorAction SilentlyContinue

  report:
    if: always() && needs.announce.result == 'success'
    needs: [announce, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish production deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" = success ]; then
            state=success
            description='Production services are healthy on ports 8095 and 8096'
          else
            state=failure
            description="Production deployment failed: $DEPLOY_RESULT"
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ADD production deployment' \
            --arg description "$description" \
            --arg target_url "$TARGET_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$DEPLOY_SHA" \
            --data "$payload"
