name: Shipping CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-package:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: auto-attn-python-dist
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build PyInstaller payload
        shell: pwsh
        run: ./installer/windows/build.ps1

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer/windows/ZKZoneAgent.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: zk-zone-agent-windows-installer
          path: installer/windows/Output/*.exe
          if-no-files-found: error

      - name: Upload PyInstaller payload
        uses: actions/upload-artifact@v4
        with:
          name: zk-zone-agent-pyinstaller-payload
          path: dist/zk-zone-agent/**
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [python-package, windows-installer]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
