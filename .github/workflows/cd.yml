name: Shipping CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-package:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: auto-attn-python-dist
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build PyInstaller payload
        shell: pwsh
        run: ./installer/windows/build.ps1

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer/windows/ZKZoneAgent.iss"

      - name: Upload Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zk-zone-agent-windows-installer
          path: installer/windows/Output/*.exe
          if-no-files-found: error

      - name: Upload PyInstaller payload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zk-zone-agent-pyinstaller-payload
          path: dist/zk-zone-agent/**
          if-no-files-found: error

      - name: Set up 32-bit Python for HR Enrollment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x86"
          cache: pip

      - name: Restore ZKTeco SDK DLL for HR Enrollment
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZKEMKEEPER_SDK_URL: ${{ secrets.ZKEMKEEPER_SDK_URL }}
          ZKEMKEEPER_DLL_SHA256: ${{ vars.ZKEMKEEPER_DLL_SHA256 }}
        run: |
          $dllDir = Join-Path $pwd "installer\windows\vendor"
          $zipPath = Join-Path $env:RUNNER_TEMP "zkteco-sdk.zip"
          $dllPath = Join-Path $dllDir "zkemkeeper.dll"
          New-Item -ItemType Directory -Force $dllDir | Out-Null

          if (![string]::IsNullOrWhiteSpace($env:ZKEMKEEPER_SDK_URL)) {
            Invoke-WebRequest -Uri $env:ZKEMKEEPER_SDK_URL -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $dllDir -Force
          } else {
            $downloadOutput = & gh release download zkteco-sdk --repo $env:GITHUB_REPOSITORY --pattern zkteco-sdk.zip --dir $env:RUNNER_TEMP 2>&1
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath)) {
              Expand-Archive -Path $zipPath -DestinationPath $dllDir -Force
            } else {
              $downloadOutput = & gh release download zkteco-sdk --repo $env:GITHUB_REPOSITORY --pattern "*.dll" --dir $dllDir 2>&1
            }
          }

          if (!(Test-Path $dllPath)) {
            $resolvedZkemkeeper = Get-ChildItem -Path $dllDir -Recurse -Filter "zkemkeeper.dll" -File | Select-Object -First 1
            if ($null -ne $resolvedZkemkeeper) {
              Copy-Item -Path (Join-Path $resolvedZkemkeeper.DirectoryName "*.dll") -Destination $dllDir -Force
            }
          }
          if (!(Test-Path $dllPath)) {
            throw "Missing ZKTeco SDK payload. Upload zkteco-sdk.zip to the zkteco-sdk release, upload the SDK DLL assets to that release, or set repository secret ZKEMKEEPER_SDK_URL to a private zip URL."
          }
          if (![string]::IsNullOrWhiteSpace($env:ZKEMKEEPER_DLL_SHA256)) {
            $actualHash = (Get-FileHash $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne ($env:ZKEMKEEPER_DLL_SHA256).ToLowerInvariant()) {
              throw "zkemkeeper.dll SHA256 mismatch. Expected $env:ZKEMKEEPER_DLL_SHA256 but found $actualHash."
            }
          }
          "ZKEMKEEPER_DLL=$dllPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build State Life HR Enrollment portable EXE
        shell: pwsh
        run: ./installer/windows/build_hr.ps1

      - name: Upload State Life HR Enrollment portable EXE
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: state-life-hr-enrollment-windows-exe
          path: dist/StateLifeHREnrollment.exe
          if-no-files-found: error

  hr-enrollment-release:
    name: Publish HR Enrollment EXE
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x86"
          cache: pip

      - name: Restore ZKTeco SDK DLL for HR Enrollment
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZKEMKEEPER_SDK_URL: ${{ secrets.ZKEMKEEPER_SDK_URL }}
          ZKEMKEEPER_DLL_SHA256: ${{ vars.ZKEMKEEPER_DLL_SHA256 }}
        run: |
          $dllDir = Join-Path $pwd "installer\windows\vendor"
          $zipPath = Join-Path $env:RUNNER_TEMP "zkteco-sdk.zip"
          $dllPath = Join-Path $dllDir "zkemkeeper.dll"
          New-Item -ItemType Directory -Force $dllDir | Out-Null

          if (![string]::IsNullOrWhiteSpace($env:ZKEMKEEPER_SDK_URL)) {
            Invoke-WebRequest -Uri $env:ZKEMKEEPER_SDK_URL -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $dllDir -Force
          } else {
            $downloadOutput = & gh release download zkteco-sdk --repo $env:GITHUB_REPOSITORY --pattern zkteco-sdk.zip --dir $env:RUNNER_TEMP 2>&1
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath)) {
              Expand-Archive -Path $zipPath -DestinationPath $dllDir -Force
            } else {
              $downloadOutput = & gh release download zkteco-sdk --repo $env:GITHUB_REPOSITORY --pattern "*.dll" --dir $dllDir 2>&1
            }
          }

          if (!(Test-Path $dllPath)) {
            $resolvedZkemkeeper = Get-ChildItem -Path $dllDir -Recurse -Filter "zkemkeeper.dll" -File | Select-Object -First 1
            if ($null -ne $resolvedZkemkeeper) {
              Copy-Item -Path (Join-Path $resolvedZkemkeeper.DirectoryName "*.dll") -Destination $dllDir -Force
            }
          }
          if (!(Test-Path $dllPath)) {
            throw "Missing ZKTeco SDK payload. Upload zkteco-sdk.zip to the zkteco-sdk release, upload the SDK DLL assets to that release, or set repository secret ZKEMKEEPER_SDK_URL to a private zip URL."
          }
          if (![string]::IsNullOrWhiteSpace($env:ZKEMKEEPER_DLL_SHA256)) {
            $actualHash = (Get-FileHash $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne ($env:ZKEMKEEPER_DLL_SHA256).ToLowerInvariant()) {
              throw "zkemkeeper.dll SHA256 mismatch. Expected $env:ZKEMKEEPER_DLL_SHA256 but found $actualHash."
            }
          }
          "ZKEMKEEPER_DLL=$dllPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build State Life HR Enrollment portable EXE
        shell: pwsh
        run: ./installer/windows/build_hr.ps1

      - name: Move rolling latest tag
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $token = $env:GITHUB_TOKEN
          git remote set-url origin "https://x-access-token:$token@github.com/$repo.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git tag -f latest $env:GITHUB_SHA
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish HR Enrollment EXE to rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Shipping CD
          body: |
            Rolling release for the latest HR Enrollment EXE from `main`.

            Commit: `${{ github.sha }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/StateLifeHREnrollment.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [python-package, windows-installer]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-artifacts/auto-attn-python-dist/* release-assets/
          cp release-artifacts/zk-zone-agent-windows-installer/*.exe release-assets/
          cp release-artifacts/state-life-hr-enrollment-windows-exe/*.exe release-assets/
          (
            cd release-artifacts
            zip -r ../release-assets/zk-zone-agent-pyinstaller-payload.zip zk-zone-agent-pyinstaller-payload
          )

      - name: Move rolling latest tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git init latest-tag-worktree
          cd latest-tag-worktree
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Shipping CD
          body: |
            Rolling release for the latest successful Shipping CD run from `main`.

            Commit: `${{ github.sha }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
