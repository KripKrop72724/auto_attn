<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "ZK Zone Agent" }}</title>
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body data-display-timezone="{{ display_timezone or 'UTC' }}">
    <aside class="sidebar">
      <div class="brand">ZK Zone Agent</div>
      <div class="time-toggle" role="group" aria-label="Time format">
        <button type="button" data-time-format-option="24">24h</button>
        <button type="button" data-time-format-option="12">12h</button>
      </div>
      <nav>
        <a href="/dashboard">Status</a>
        <a href="/setup">Setup</a>
        <a href="/devices">Devices</a>
        <a href="/devices/scan">Scan</a>
        <a href="/attendance">Attendance</a>
        <a href="/clock-guard">Clock Guard</a>
        <a href="/outages">Outages</a>
        <a href="/sync-queue">Sync Queue</a>
        <a href="/logs">Logs</a>
        {% if admin_authenticated %}
          <form class="nav-form" method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Lock Admin</button>
          </form>
        {% else %}
          <a href="/login">Admin Unlock</a>
        {% endif %}
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
