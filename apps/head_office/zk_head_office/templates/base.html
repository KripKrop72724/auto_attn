<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "ZK Head Office" }}</title>
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">Head Office</div>
      <nav>
        <a href="/">Overview</a>
        <a href="/zones">Zones</a>
        <a href="/devices">Devices</a>
        <a href="/attendance">Attendance</a>
        <a href="/incidents">Fraud Incidents</a>
        <a href="/clock">Clock Timeline</a>
        <a href="/outages">Outage Timeline</a>
        <a href="/reports/attendance.csv">CSV Export</a>
        {% if admin_auth_required %}
          {% if admin_authenticated %}
            <form class="nav-form" method="post" action="/logout">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button type="submit">Lock Admin</button>
            </form>
          {% else %}
            <a href="/login">Admin Login</a>
          {% endif %}
        {% endif %}
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
