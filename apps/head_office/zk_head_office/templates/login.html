{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <h1>Admin Login</h1>
  <p>Unlock the head office dashboard and zone token controls.</p>
</section>
{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<form class="panel form" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Admin Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
  <button class="primary" type="submit">Unlock</button>
</form>
{% endblock %}
