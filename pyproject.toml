[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkteco-attendance-poc"
version = "0.1.11"
description = "Windows zone-agent and head-office POC for fraud-resistant ZKTeco attendance capture."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "webauthn>=2.7.1",
  "psutil>=5.9",
  "pyzk>=0.9",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pyinstaller>=6.8",
]

[project.scripts]
zk-zone-agent = "zk_zone_agent.__main__:main"
zk-head-office = "zk_head_office.__main__:main"
state-life-hr-enrollment = "zk_hr_enrollment.__main__:main"

[tool.setuptools]
packages = ["zk_common", "zk_zone_agent", "zk_head_office", "zk_hr_enrollment"]
package-dir = { "zk_common" = "packages/common/zk_common", "zk_zone_agent" = "apps/zone_agent/zk_zone_agent", "zk_head_office" = "apps/head_office/zk_head_office", "zk_hr_enrollment" = "apps/hr_enrollment/zk_hr_enrollment" }
include-package-data = false

[tool.setuptools.package-data]
zk_zone_agent = ["templates/*.html", "static/*"]
zk_head_office = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["apps/zone_agent", "apps/head_office", "apps/hr_enrollment", "packages/common"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]
