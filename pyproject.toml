[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-life-attendance-device-dashboard"
version = "2.2.0"
description = "State Life ADD control plane for securely managed Zone Lite ESP32 connectors."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
zk-add = "zk_add.__main__:main"

[tool.setuptools]
packages = ["zk_add"]
package-dir = { "zk_add" = "apps/add_backend/zk_add" }
include-package-data = false

[tool.pytest.ini_options]
pythonpath = ["apps/add_backend"]
testpaths = ["tests/unit", "tests/firmware"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]
